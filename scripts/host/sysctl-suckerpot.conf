# SuckerPot host safeguard: keep the connection-tracking table from filling up when the
# sensors face scans and floods (many short TCP connections, spoofed UDP to SIP).
# A full table makes the kernel drop NEW connections for every service on this host,
# including the admin SSH port. Install it yourself (see scripts/host/README.md);
# nothing in this repository applies it.
#
#   sudo install -m 0644 scripts/host/sysctl-suckerpot.conf /etc/sysctl.d/90-suckerpot.conf
#   sudo sysctl --system
#   sysctl net.netfilter.nf_conntrack_max      # verify

# Room for 262144 tracked connections (about 80 MB of kernel memory at most).
net.netfilter.nf_conntrack_max = 262144
# UDP "flows" from spoofed SIP floods disappear quickly.
net.netfilter.nf_conntrack_udp_timeout = 10
net.netfilter.nf_conntrack_udp_timeout_stream = 60
# Half-open TCP entries (SYN floods) are forgotten sooner.
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 30
