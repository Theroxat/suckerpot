# Lite overlay (M35): participant mode on a 1 GiB VPS or a Raspberry Pi with 1 GiB. It is stacked
# on top of docker-compose.lowmem.yml and only lowers three more resource limits (the database, Redis
# and ingest) together with the matching tuning figures. Sensor limits stay as the low-memory
# overlay sets them. Networks, volumes, capabilities, ports and every security setting are
# untouched, and scripts/guardrails/tests/test_lite.py fails if this file ever sets anything else.
#
# The installer turns it on with `scripts/install.sh --participant --lite`, which writes:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.lowmem.yml:docker-compose.lite.yml:docker-compose.participant.yml
#
# and a default sensor list of ssh, telnet, web and redis (docs/vps.md).
services:
  db:
    # Replaces the whole command, like the low-memory overlay does.
    command: !override
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=160MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
      - -c
      - timescaledb.max_background_workers=2
      - -c
      - timescaledb.telemetry_level=off
      - -c
      - log_min_duration_statement=1000
    shm_size: 96m
    mem_limit: 320m
    memswap_limit: 320m

  redis:
    environment:
      REDIS_MAXMEMORY_MB: "64"
    mem_limit: 128m
    memswap_limit: 128m

  ingest:
    mem_limit: 256m
    memswap_limit: 256m
