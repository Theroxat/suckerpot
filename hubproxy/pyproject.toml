[project]
name = "suckerpot-hubproxy"
version = "0.1.0"
description = "SuckerPot hubproxy: allow-list CONNECT forward proxy for participant installs without a VPN"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hubproxy"]

[tool.ruff]
line-length = 100
target-version = "py315"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S311", "S101", "S105", "S106", "S108", "S104", "E501"]

[tool.mypy]
strict = true
python_version = "3.15"
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
