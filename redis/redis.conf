# SuckerPot Redis configuration. Users and passwords live in the ACL file that
# the entrypoint generates from environment variables; none of them are here.

port 6379
# Inside the container network only: the "sensors" and "backend" networks are
# internal and Redis is never published on the host.
bind * -::*
protected-mode yes

aclfile /run/redis/users.acl

dir /data
appendonly yes
appendfsync everysec
# AOF only: no RDB snapshots.
save ""

# The stream is capped by the producers (XADD MAXLEN ~). If memory fills up,
# refuse writes instead of evicting events.
maxmemory 192mb
maxmemory-policy noeviction

maxclients 512
proto-max-bulk-len 1mb
client-query-buffer-limit 1mb
timeout 300
tcp-keepalive 60

loglevel notice
