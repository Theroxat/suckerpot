[project]
name = "suckerpot-sensor-telnet"
version = "0.1.0"
description = "SuckerPot Telnet sensor: BusyBox-style IoT device with a pure-emulation shell."
requires-python = ">=3.13"
dependencies = [
    "suckerpot-common",
    "suckerpot-sensor-ssh",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telnet_sensor"]

[tool.uv.sources]
suckerpot-common = { path = "../common" }
suckerpot-sensor-ssh = { path = "../ssh" }

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S104", "S311", "S603", "S607", "RUF001", "RUF059", "E501", "ASYNC109", "ASYNC251"]
"telnet_sensor/device.py" = ["E501", "S108", "RUF001"]
"telnet_sensor/commands.py" = ["E501", "S108", "RUF001"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
