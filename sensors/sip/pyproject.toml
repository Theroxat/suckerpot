[project]
name = "suckerpot-sensor-sip"
version = "0.1.0"
description = "SuckerPot SIP sensor: a small PBX endpoint that only observes (UDP and TCP 5060)."
requires-python = ">=3.13"
dependencies = [
    "suckerpot-common",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sip_sensor"]

[tool.uv.sources]
suckerpot-common = { path = "../common" }

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["UP031"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S311", "E501", "ASYNC109", "RUF059", "S101", "S105", "S106", "S108", "S104", "S603", "S607", "S324"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
