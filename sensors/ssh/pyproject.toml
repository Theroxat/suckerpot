[project]
name = "suckerpot-sensor-ssh"
version = "0.1.0"
description = "SuckerPot SSH sensor: SSH server with a pure-emulation fake shell."
requires-python = ">=3.13"
dependencies = [
    "suckerpot-common",
    "asyncssh>=2.18,<3",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ssh_sensor"]

[tool.uv.sources]
suckerpot-common = { path = "../common" }

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"ssh_sensor/shell/*.py" = ["E501", "S108", "RUF001", "RUF059", "RUF005", "UP031", "RUF034", "S101", "S105"]
"tests/**" = ["S101", "S105", "S106", "S108", "S104", "S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
