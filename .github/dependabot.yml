version: 2
# One update entry per ecosystem, covering every directory of that ecosystem, so that one bump
# shared by many packages (a base image, a library) arrives as ONE pull request. In each ecosystem,
# minor and patch updates are grouped together and major updates come in a separate group, to be
# reviewed (and migrated) on their own.
updates:
  - package-ecosystem: "uv"
    directories:
      - "/analysis"
      - "/api"
      - "/collector"
      - "/db"
      - "/egress"
      - "/hub"
      - "/hubproxy"
      - "/ingest"
      - "/netproto"
      - "/reporting"
      - "/scripts/demo"
      - "/scripts/guardrails"
      - "/sensors/adb"
      - "/sensors/common"
      - "/sensors/docker"
      - "/sensors/mssql"
      - "/sensors/mysql"
      - "/sensors/rdp"
      - "/sensors/redis"
      - "/sensors/sip"
      - "/sensors/smb"
      - "/sensors/ssh"
      - "/sensors/synology"
      - "/sensors/telnet"
      - "/sensors/web"
    schedule:
      interval: "monthly"
    groups:
      uv-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      uv-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # typescript-eslint (the lint toolchain) declares a peer range of typescript <6.1.0, so a new
      # TypeScript major breaks `pnpm run lint`. Move TypeScript by hand once typescript-eslint
      # supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "docker"
    directories:
      - "/api"
      - "/collector"
      - "/db"
      - "/hub"
      - "/hubproxy"
      - "/ingest"
      - "/redis"
      - "/scripts/demo"
      - "/sensors/adb"
      - "/sensors/docker"
      - "/sensors/mssql"
      - "/sensors/mysql"
      - "/sensors/rdp"
      - "/sensors/redis"
      - "/sensors/sip"
      - "/sensors/smb"
      - "/sensors/ssh"
      - "/sensors/synology"
      - "/sensors/telnet"
      - "/sensors/web"
    schedule:
      interval: "monthly"
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/hub"
    schedule:
      interval: "monthly"
    groups:
      compose-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      compose-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # The hub database stays on PostgreSQL 17: a major upgrade needs a data migration
      # (pg_upgrade or dump and restore, and PostgreSQL 18 images also moved PGDATA), done by hand.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
