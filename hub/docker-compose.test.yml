# Throwaway hub stack for tests. Local volumes only, no Caddy, no TLS, documentation address
# ranges accepted, a low proof-of-work difficulty and dummy passwords. NEVER deploy this file.
#
#   docker compose -f hub/docker-compose.test.yml -p hubtest-$$ up -d --build --wait
#   ... run the tests on the network hubtest-<n>_default (see `just hub-integration`) ...
#   docker compose -f hub/docker-compose.test.yml -p hubtest-$$ down -v
#
# Always pass a throwaway project name (-p hubtest-<something>); `down -v` then removes only
# this project's volumes.

name: hubtest

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-test-env: &test-env
  HUB_SIGNING_KEY_FILE: /keys/hub.key
  HUB_ALLOW_DOCUMENTATION: "1"
  HUB_ALLOW_DEFAULT_SECRETS: "1"
  HUB_POW_DIFFICULTY: "8"
  HUB_NODE_MIN_AGE_DAYS: "14"
  HUB_VERIFY_MODE: auto

services:
  hub-db:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    <<: *hardening
    user: "999:999"
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${HUB_DB_PASSWORD:-hubtest-owner-password-0001}
    command: ["postgres", "-c", "fsync=off", "-c", "log_connections=off", "-c", "log_statement=none"]
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,nodev,size=256m,uid=999,gid=999
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=1m,uid=999,gid=999
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=999,gid=999
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  hub-keygen:
    build:
      context: ..
      dockerfile: hub/Dockerfile
    <<: *hardening
    user: "10001:10001"
    entrypoint: ["python", "-m", "hub.admin", "gen-signing-key", "--out", "/keys/hub.key", "--force"]
    volumes:
      - keys:/keys
    restart: "no"

  hub-migrate:
    build:
      context: ..
      dockerfile: hub/Dockerfile
    <<: *hardening
    user: "10001:10001"
    command: ["python", "-m", "hub.migrate"]
    environment:
      <<: *test-env
      HUB_MIGRATE_DATABASE_URL: postgresql+asyncpg://hub:${HUB_DB_PASSWORD:-hubtest-owner-password-0001}@hub-db:5432/hub
      HUB_DB_PASSWORD: ${HUB_DB_PASSWORD:-hubtest-owner-password-0001}
      HUB_API_DB_PASSWORD: ${HUB_API_DB_PASSWORD:-hubtest-api-password-0002}
      HUB_WORKER_DB_PASSWORD: ${HUB_WORKER_DB_PASSWORD:-hubtest-worker-password-0003}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    restart: "no"
    depends_on:
      hub-db:
        condition: service_healthy

  hub-api:
    build:
      context: ..
      dockerfile: hub/Dockerfile
    <<: *hardening
    user: "10001:10001"
    environment:
      <<: *test-env
      HUB_DATABASE_URL: postgresql+asyncpg://hub_api:${HUB_API_DB_PASSWORD:-hubtest-api-password-0002}@hub-db:5432/hub
    volumes:
      - keys:/keys:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    mem_limit: 256m
    depends_on:
      hub-migrate:
        condition: service_completed_successfully
      hub-keygen:
        condition: service_completed_successfully

  # The feeds volume and the services around it. The e2e test publishes into /srv/feeds from a
  # test container that mounts the volume, Caddy serves it, and a REAL minisign answers
  # verify/sign requests dropped in the `verify-io` volume (tests/e2e/minisign-daemon.sh).
  feeds-init:
    image: alpine:3.21@sha256:ee16d92f96db08d9d2d07da48555a27f3a69d8f0759021dbc601195ed0d2b5bd
    <<: *hardening
    user: "0:0"
    command: ["chmod", "0777", "/srv/feeds", "/io"]
    volumes:
      - feeds:/srv/feeds
      - verify-io:/io
    restart: "no"

  minisign-verify:
    # Upstream minisign from the pinned Alpine release. Interoperability check only.
    build:
      dockerfile_inline: |
        FROM alpine:3.21@sha256:ee16d92f96db08d9d2d07da48555a27f3a69d8f0759021dbc601195ed0d2b5bd
        RUN apk add --no-cache minisign=0.11-r1
    <<: *hardening
    user: "10002:10002"
    entrypoint: ["sh", "/daemon.sh"]
    volumes:
      - ./tests/e2e/minisign-daemon.sh:/daemon.sh:ro
      - feeds:/feeds:ro
      - verify-io:/io
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=4m,uid=10002,gid=10002
    mem_limit: 64m
    depends_on:
      feeds-init:
        condition: service_completed_successfully

  # The real Caddyfile, plain HTTP: the ports below replace the public host names, so there is no
  # certificate. Reachable inside the compose network only (nothing is published).
  feeds-caddy:
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    <<: *hardening
    user: "65532:65532"
    cap_add: [NET_BIND_SERVICE]  # the binary's file capability; see docker-compose.yml
    environment:
      HUB_DOMAIN: ":8082"
      HUB_FEEDS_DOMAIN: ":8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - feeds:/srv/feeds:ro
    tmpfs:
      - /data:rw,noexec,nosuid,nodev,size=8m,uid=65532,gid=65532
      - /config:rw,noexec,nosuid,nodev,size=8m,uid=65532,gid=65532
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 2s
      timeout: 2s
      retries: 20
    mem_limit: 128m
    depends_on:
      feeds-init:
        condition: service_completed_successfully

  # Participant end-to-end test only (scripts/e2e/participant.sh): the TLS edge of the throwaway hub.
  # Caddy's internal CA signs the certificate of suckerpot-hub.selfhostr.io, which is an alias on the pre-made,
  # internal "uplink" network that the test participant's hubproxy shares. No real DNS record, no
  # public certificate, no published port; the name never leaves the throwaway Docker networks.
  hub-edge:
    profiles: [participant-e2e]
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    <<: *hardening
    user: "65532:65532"
    cap_add: [NET_BIND_SERVICE]  # the binary's file capability; see docker-compose.yml
    volumes:
      - ./Caddyfile.test:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data:rw,noexec,nosuid,nodev,size=8m,uid=65532,gid=65532
      - /config:rw,noexec,nosuid,nodev,size=8m,uid=65532,gid=65532
    networks:
      default: {}
      uplink:
        ipv4_address: ${E2E_HUB_IP:-11.251.77.10}
        aliases: [suckerpot-hub.selfhostr.io]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 64m
    depends_on:
      hub-api:
        condition: service_started

networks:
  # Only used by hub-edge (profile participant-e2e): internal, created by the script.
  uplink:
    external: true
    name: ${E2E_UPLINK_NET:-hubtest-uplink-unset}

volumes:
  keys:
  feeds:
  verify-io:
