# Known research scanners: harmless internet-wide crawlers that publish what they do and where
# they come from. A session from one of them is labelled "benign" and hidden from the dashboard
# by default (a sidebar switch shows it again). Nothing is blocked or dropped: it is only a label.
#
# A scanner is recognised only by the network that owns the address (``asns``, ``orgs``: a
# case-insensitive substring of the organisation name), both from the local GeoIP database, which
# an attacker cannot forge. The HTTP user-agent is never used: it is attacker-controlled.
# Even then a session is labelled benign only while it just looks around (connects, probes, sends
# GET, HEAD or OPTIONS: no login, command, download, exploit flag or attack tag): see
# ingest/scanners.py. One request that does more makes it non-benign for good.
scanners:
  - name: Censys
    asns: [398324, 398722, 398705]
    orgs: [censys]

  - name: Shodan
    orgs: [shodan]

  - name: Shadowserver
    orgs: [shadowserver]

  - name: BinaryEdge
    orgs: [binaryedge]

  - name: Palo Alto Cortex Xpanse
    orgs: [expanse]

  - name: Net Systems Research
    orgs: [net systems research]

  - name: LeakIX
    orgs: [leakix]

  - name: ONYPHE
    orgs: [onyphe]

  - name: Netlas
    orgs: [netlas]

  - name: Stretchoid
    orgs: [stretchoid]
