# Low-memory overlay (M28): lets the stack run on a 2 GiB machine (a Raspberry Pi 4 with 2 GiB or a
# small VPS) with up to five sensors and some swap on the host. It only changes resource limits:
# memory limits, shared memory, the database tuning flags and the matching "stay under this figure"
# variables that the services read. Networks, volumes, capabilities and ports are untouched, and
# scripts/guardrails/tests/test_lowmem.py fails if this file ever sets anything else.
#
# The installer turns it on by writing this line to .env, so plain `docker compose` and every
# `just` recipe pick it up:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.lowmem.yml
#
# Rule of thumb: a sensor's "memory limit" variable must equal its mem_limit (the sensor sheds load
# as it nears that figure instead of being killed).
services:
  db:
    # Replaces the whole command of the base file (see the comment there for the flags).
    command: !override
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
      - -c
      - timescaledb.max_background_workers=2
      - -c
      - timescaledb.telemetry_level=off
      - -c
      - log_min_duration_statement=1000
    shm_size: 128m
    mem_limit: 512m
    memswap_limit: 512m

  redis:
    environment:
      REDIS_MAXMEMORY_MB: "96"
    mem_limit: 192m
    memswap_limit: 192m

  ingest:
    mem_limit: 320m
    memswap_limit: 320m

  api:
    mem_limit: 320m
    memswap_limit: 320m

  collector:
    mem_limit: 192m
    memswap_limit: 192m

  analyzer:
    environment:
      # The rlimited child stays under the container limit.
      ANALYZER_MEMORY_MB: ${ANALYZER_MEMORY_MB:-160}
    mem_limit: 256m
    memswap_limit: 256m

  sensor-ssh:
    environment:
      SSH_MEMORY_LIMIT_MB: "128"
    mem_limit: 128m
    memswap_limit: 128m

  sensor-rdp:
    mem_limit: 128m
    memswap_limit: 128m

  sensor-telnet:
    mem_limit: 128m
    memswap_limit: 128m

  sensor-web:
    environment:
      WEB_MEMORY_LIMIT_MB: "128"
    mem_limit: 128m
    memswap_limit: 128m

  sensor-redis:
    environment:
      SENSOR_MEMORY_LIMIT: "134217728"
    mem_limit: 128m
    memswap_limit: 128m

  sensor-docker:
    environment:
      DOCKER_MEMORY_LIMIT_MB: "128"
    mem_limit: 128m
    memswap_limit: 128m

  sensor-mysql:
    environment:
      SENSOR_MEMORY_LIMIT: "134217728"
    mem_limit: 128m
    memswap_limit: 128m

  sensor-mssql:
    environment:
      SENSOR_MEMORY_LIMIT: "134217728"
    mem_limit: 128m
    memswap_limit: 128m

  sensor-adb:
    environment:
      # Its default budget (112 MiB) leaves no room under a 128 MiB limit.
      SENSOR_MEMORY_BUDGET_MB: "64"
    mem_limit: 128m
    memswap_limit: 128m

  sensor-smb:
    environment:
      SMB_MEMORY_LIMIT: "134217728"
    mem_limit: 128m
    memswap_limit: 128m

  sensor-sip:
    environment:
      SENSOR_MEMORY_LIMIT: "134217728"
    mem_limit: 128m
    memswap_limit: 128m

  sensor-synology:
    environment:
      SYNOLOGY_MEMORY_LIMIT_MB: "128"
      SYNOLOGY_MEMORY_BUDGET_MB: ${SYNOLOGY_MEMORY_BUDGET_MB:-48}
    mem_limit: 128m
    memswap_limit: 128m
