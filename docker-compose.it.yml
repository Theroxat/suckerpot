# Overlay for `just test-integration`: the throwaway project only needs db and redis on the
# backend network. Dropping redis's per-sensor networks keeps the run within Docker's default
# address pools while the live stack holds its own networks.
services:
  redis:
    networks: !override [backend]
  # Same reason: the "samples" network only matters to the collector and analyzer.
  db:
    networks: !override [backend]

# Project-local volumes: the base file declares every data volume as external and named
# suckerpot_*; a test run must never mount those. `!override {}` drops that declaration.
volumes:
  redis-data: !override {}
  db-data: !override {}
  ssh-hostkeys: !override {}
  rdp-data: !override {}
  telnet-data: !override {}
  web-data: !override {}
  redis-sensor-data: !override {}
  docker-sensor-data: !override {}
  mysql-sensor-data: !override {}
  mssql-sensor-data: !override {}
  adb-sensor-data: !override {}
  smb-sensor-data: !override {}
  sip-sensor-data: !override {}
  synology-sensor-data: !override {}
  geoip-data: !override {}
  quarantine: !override {}
  vpn-config: !override {}
  backups: !override {}
