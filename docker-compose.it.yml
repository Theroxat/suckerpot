# Overlay for `just test-integration`: the throwaway project only needs db and redis on the
# backend network. Dropping redis's per-sensor networks keeps the run within Docker's default
# address pools while the live stack holds its own networks.
services:
  # The backup service is for the live stack only (and needs a writable, uid 70 owned volume).
  # Test stacks start without it; `docker compose --profile backup up backup` is still possible.
  backup:
    profiles: ["backup"]
  redis:
    image: "local/${COMPOSE_PROJECT_NAME:?}-redis:test"
    networks: !override [backend]
  # Same reason: the "samples" network only matters to the collector and analyzer.
  db:
    networks: !override [backend]
  # Built images get a name scoped to the throwaway project, so a test run can never retag the
  # images of the live stack.
  migrate:
    image: "local/${COMPOSE_PROJECT_NAME:?}-migrate:test"
  ingest:
    image: "local/${COMPOSE_PROJECT_NAME:?}-ingest:test"
  api:
    image: "local/${COMPOSE_PROJECT_NAME:?}-api:test"
  sensor-ssh:
    image: "local/${COMPOSE_PROJECT_NAME:?}-sensor-ssh:test"
  sensor-rdp:
    image: "local/${COMPOSE_PROJECT_NAME:?}-sensor-rdp:test"
  sensor-telnet:
    image: "local/${COMPOSE_PROJECT_NAME:?}-sensor-telnet:test"
  sensor-web:
    image: "local/${COMPOSE_PROJECT_NAME:?}-sensor-web:test"
  sensor-redis:
    image: "local/${COMPOSE_PROJECT_NAME:?}-sensor-redis:test"
  sensor-docker:
    image: "local/${COMPOSE_PROJECT_NAME:?}-sensor-docker:test"
  sensor-mysql:
    image: "local/${COMPOSE_PROJECT_NAME:?}-sensor-mysql:test"
  sensor-mssql:
    image: "local/${COMPOSE_PROJECT_NAME:?}-sensor-mssql:test"
  sensor-adb:
    image: "local/${COMPOSE_PROJECT_NAME:?}-sensor-adb:test"
  sensor-smb:
    image: "local/${COMPOSE_PROJECT_NAME:?}-sensor-smb:test"
  sensor-sip:
    image: "local/${COMPOSE_PROJECT_NAME:?}-sensor-sip:test"
  sensor-synology:
    image: "local/${COMPOSE_PROJECT_NAME:?}-sensor-synology:test"
  collector:
    image: "local/${COMPOSE_PROJECT_NAME:?}-collector:test"
  analyzer:
    image: "local/${COMPOSE_PROJECT_NAME:?}-collector:test"
  demo:
    image: "local/${COMPOSE_PROJECT_NAME:?}-demo:test"
  hubproxy:
    image: "local/${COMPOSE_PROJECT_NAME:?}-hubproxy:test"

# The base file gives backend a fixed bridge name (sp-backend) that a live stack on the same
# machine already holds. The throwaway project keeps the isolation, without the fixed name.
networks:
  backend: !override
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated

# Project-local volumes with an explicit "test-" name. The base file declares every data volume as
# external and named <prefix>_<volume>; a test run must never mount those, and a plain
# <project>_<volume> default could still equal a live name when the project is "suckerpot".
# "test-<prefix>_<volume>" can never equal "<anything>_<volume>" of the live stack.
volumes:
  redis-data: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_redis-data" }
  db-data: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_db-data" }
  ssh-hostkeys: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_ssh-hostkeys" }
  rdp-data: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_rdp-data" }
  telnet-data: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_telnet-data" }
  web-data: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_web-data" }
  redis-sensor-data: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_redis-sensor-data" }
  docker-sensor-data: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_docker-sensor-data" }
  mysql-sensor-data: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_mysql-sensor-data" }
  mssql-sensor-data: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_mssql-sensor-data" }
  adb-sensor-data: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_adb-sensor-data" }
  smb-sensor-data: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_smb-sensor-data" }
  sip-sensor-data: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_sip-sensor-data" }
  synology-sensor-data: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_synology-sensor-data" }
  geoip-data: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_geoip-data" }
  quarantine: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_quarantine" }
  vpn-config: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_vpn-config" }
  backups: !override { name: "test-${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set}_backups" }
