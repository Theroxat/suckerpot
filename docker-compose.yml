  # SIP sensor: a fake PBX (UDP and TCP), rate-limited so it can never be used as a reflector.
  sensor-sip:
    build:
      context: .
      dockerfile: sensors/sip/Dockerfile
    <<: *hardening
    user: "10001:10001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USER: sensor-sip
      REDIS_PASSWORD: ${REDIS_SENSOR_SIP_PASSWORD:?REDIS_SENSOR_SIP_PASSWORD must be set in .env}
      EVENTS_STREAM: events:sip
      # Short stream cap: seven more sensors share Redis memory. Ingest drains it continuously.
      EVENTS_MAXLEN: ${EVENTS_MAXLEN_LOW:-3000}
      EVENTS_MAX_BYTES_PER_SEC: ${EVENTS_MAX_BYTES_PER_SEC:-200000}
      EVENTS_MAX_BYTES_BURST: ${EVENTS_MAX_BYTES_BURST:-2000000}
      SENSOR_PORT: "5060"
      SIP_PUBLIC_PORT: ${SIP_HOST_PORT:-5060}
      SENSOR_DATA_DIR: /data
      # Public addresses of this honeypot (comma-separated). The sensor never answers them,
      # so it cannot be made to talk to itself.
      SENSOR_SIP_OWN_IPS: ${SIP_OWN_IPS:-}
      SENSOR_MAX_CONNECTIONS: ${SIP_MAX_CONNECTIONS:-200}
      SENSOR_MAX_PER_IP: ${SIP_MAX_PER_IP:-8}
      # Keep equal to mem_limit below: the sensor sheds load as it nears this figure.
      SENSOR_MEMORY_LIMIT: "167772160"
    # Explicit IPv4 so Docker does not also publish on [::]. No capability needed.
    ports:
      - "0.0.0.0:${SIP_HOST_PORT:-5060}:5060/udp"
      - "0.0.0.0:${SIP_HOST_PORT:-5060}:5060/tcp"
    # Docker's embedded DNS still resolves service names; external names fail.
    dns: ["127.0.0.1"]
    # ingress: inbound only. sensors-sip: internal link to Redis.
