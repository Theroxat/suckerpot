  # Anonymous egress (M21): the only container with a route to the internet, and only through
  # a WireGuard tunnel (gluetun firewall = kill switch). Profile "egress": without it the
  # stack runs without outbound access and every external lookup stays idle.
  vpn:
    image: qmcgaw/gluetun:v3.41.1@sha256:1a5bf4b4820a879cdf8d93d7ef0d2d963af56670c9ebff8981860b6804ebc8ab
    profiles: [egress]
    read_only: true
    cap_drop: [ALL]
    # gluetun runs as root to program iptables; with everything else dropped that root
    # keeps NET_ADMIN only.
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    # vpn/entrypoint.sh picks the WireGuard settings (the file uploaded from Settings -> VPN wins
    # over .env), drops the IPv6 addresses (the Docker networks have no IPv6 and gluetun refuses
    # them) and restarts the container when the uploaded file changes (M23).
    entrypoint: ["/bin/sh", "/vpn/entrypoint.sh"]
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
    environment:
      TZ: UTC
      # An account that already exists in the image (nobody): gluetun would otherwise try to
      # create one and fail on the read-only /etc/passwd.
      PUID: "65534"
      PGID: "65534"
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      VPN_INTERFACE: wg0
      WIREGUARD_IMPLEMENTATION: userspace
      # Empty values make gluetun exit: fail closed.
      WIREGUARD_PRIVATE_KEY: ${VPN_WG_PRIVATE_KEY:-}
      WIREGUARD_PUBLIC_KEY: ${VPN_WG_PEER_PUBLIC_KEY:-}
      WIREGUARD_ADDRESSES: ${VPN_WG_ADDRESSES:-}
      WIREGUARD_ENDPOINT_IP: ${VPN_WG_ENDPOINT_IP:-}
      WIREGUARD_ENDPOINT_PORT: ${VPN_WG_ENDPOINT_PORT:-}
      WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: 25s
      # gluetun v3.41.1 has no variable for a custom plain-DNS upstream: it keeps its default
      # (DNS over TLS to a public resolver), which also goes through the tunnel.
      DNS_UPSTREAM_IPV6: "off"
      DNS_KEEP_NAMESERVER: "off"
      # Must stay off: the blocklist would stop the collector from resolving the hosts it fetches.
      BLOCK_MALICIOUS: "off"
      BLOCK_SURVEILLANCE: "off"
      BLOCK_ADS: "off"
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
      HTTPPROXY_STEALTH: "on"
      HTTPPROXY_LOG: "off"
      HTTPPROXY_USER: egress
      HTTPPROXY_PASSWORD: ${EGRESS_PROXY_PASSWORD:-}
      SHADOWSOCKS: "off"
      HTTP_CONTROL_SERVER_ADDRESS: ":8000"
      HTTP_CONTROL_SERVER_LOG: "off"
      HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: /gluetun/auth/config.toml
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: "{}"
      PUBLICIP_ENABLED: "on"
      PUBLICIP_FILE: /gluetun/ip
      # The startup health check must use IP:port targets. With the default host names, DNS fails
      # at once (the tunnel is not up yet), gluetun restarts the VPN every second and the
      # WireGuard handshake never completes.
      HEALTH_TARGET_ADDRESSES: "1.1.1.1:443,9.9.9.9:443"
      HEALTH_SMALL_CHECK_TYPE: dns
      HEALTH_RESTART_VPN: "on"
      VERSION_INFORMATION: "off"
      UPDATER_PERIOD: "0"
      # FIREWALL_OUTBOUND_SUBNETS must stay unset: it would open LAN routes outside the tunnel.
    volumes:
      - ./vpn/control-auth.toml:/gluetun/auth/config.toml:ro
      - ./vpn/entrypoint.sh:/vpn/entrypoint.sh:ro
      # Healthy in idle mode (no VPN configured yet), else gluetun's own healthcheck.
      - ./vpn/health.sh:/vpn/health.sh:ro
      # Uploaded WireGuard settings (wg.env), written by the api; read-only here.
      - vpn-config:/vpn-config:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=0755
      - /gluetun:rw,noexec,nosuid,nodev,size=8m,mode=0755
      # wireguard-go control sockets.
      - /run/wireguard:rw,noexec,nosuid,nodev,size=1m
    # gluetun cannot rewrite /etc/resolv.conf on a read-only root: point it at its own DNS
    # server (which forwards through the tunnel) so name lookups never use Docker's resolver.
    dns: ["127.0.0.1"]
    networks:
      vpn-uplink:
        gw_priority: 100
      egress-proxy: {}
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64
    # The api must create its containers first: the first container to mount the empty vpn-config
    # volume fixes its owner (copied from the api image, uid 10001).
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/sh", "/vpn/health.sh"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    # no ports: nothing is published

  # Participant mode without a VPN (M32): a tiny allow-list forward proxy, the ONLY service with a
  # route out in that mode. It accepts CONNECT to the hub (and optionally feed) host on 443 and
  # nothing else (hubproxy/). Profile `direct`, never together with `vpn` (profile `egress`).
  hubproxy:
    profiles: [direct]
    image: ${SUCKERPOT_IMAGE_PREFIX:-local/${COMPOSE_PROJECT_NAME:-unset}}-hubproxy:${SUCKERPOT_VERSION:-dev}
    build:
      context: .
      dockerfile: hubproxy/Dockerfile
      args:
        VERSION: ${SUCKERPOT_BUILD_VERSION:-dev}
        BUILD_KIND: source
        COMMIT: ${SUCKERPOT_BUILD_COMMIT:-unknown}
    <<: *hardening
    user: "10001:10001"
    environment:
      # Empty values make hubproxy refuse to start (fail closed). Not `:?` here: compose
      # interpolates inactive profiles too, and full-mode installs set neither variable.
      HUBPROXY_ALLOW: ${HUBPROXY_ALLOW:-}
      HUBPROXY_PASSWORD: ${EGRESS_PROXY_PASSWORD:-}
      HUBPROXY_MAX_CONNS: "8"
      # Listen only on the hub-proxy network (the alias below exists on that network only),
      # never on the uplink. Refuses to start unless it resolves to exactly one address.
      HUBPROXY_BIND_HOST: hubproxy-internal
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1m
    # Docker's embedded resolver is needed to resolve the allowed names.
    networks:
      hub-uplink:
        gw_priority: 100
      hub-proxy:
        aliases: [hubproxy-internal]
    mem_limit: 48m
    memswap_limit: 48m
    cpus: 0.25
    pids_limit: 32
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "hubproxy.healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    # no ports, no volumes: nothing is published

  # Fetches the files behind captured download URLs, through the vpn proxy only. Hashes and
  # stores them in quarantine; never parses or executes them.
  collector:
    profiles: [egress]
    image: ${SUCKERPOT_IMAGE_PREFIX:-local/${COMPOSE_PROJECT_NAME:-unset}}-collector:${SUCKERPOT_VERSION:-dev}
    build:
      context: .
      dockerfile: collector/Dockerfile
      args:
        VERSION: ${SUCKERPOT_BUILD_VERSION:-dev}
        BUILD_KIND: source
        COMMIT: ${SUCKERPOT_BUILD_COMMIT:-unknown}
    command: ["python", "-m", "collector", "fetch"]
    <<: *hardening
    user: "10001:10001"
    environment:
      <<: *db-env
      POSTGRES_USER: ${POSTGRES_COLLECTOR_USER:-suckerpot_collector}
      POSTGRES_PASSWORD: ${POSTGRES_COLLECTOR_PASSWORD:-}
      COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-false}
      COLLECTOR_POLL_S: ${COLLECTOR_POLL_S:-15}
      COLLECTOR_MAX_BYTES: ${COLLECTOR_MAX_BYTES:-16777216}
      COLLECTOR_TIMEOUT_S: ${COLLECTOR_TIMEOUT_S:-60}
      COLLECTOR_CONNECT_TIMEOUT_S: ${COLLECTOR_CONNECT_TIMEOUT_S:-10}
      COLLECTOR_MAX_REDIRECTS: ${COLLECTOR_MAX_REDIRECTS:-3}
      COLLECTOR_CONCURRENCY: ${COLLECTOR_CONCURRENCY:-2}
      COLLECTOR_HOST_INTERVAL_S: ${COLLECTOR_HOST_INTERVAL_S:-10}
      COLLECTOR_HOURLY_QUOTA: ${COLLECTOR_HOURLY_QUOTA:-60}
      COLLECTOR_DAILY_QUOTA: ${COLLECTOR_DAILY_QUOTA:-500}
      COLLECTOR_REFETCH_HOURS: ${COLLECTOR_REFETCH_HOURS:-24}
      COLLECTOR_MAX_DEPTH: ${COLLECTOR_MAX_DEPTH:-2}
      COLLECTOR_DENY_CIDRS: ${COLLECTOR_DENY_CIDRS:-}
      # Takedown re-checks (M27): also need COLLECTOR_ENABLED. One GET of a URL that already
      # served a sample, nothing else.
      TAKEDOWN_ENABLED: ${TAKEDOWN_ENABLED:-false}
      TAKEDOWN_HTTP_DAILY_QUOTA: ${TAKEDOWN_HTTP_DAILY_QUOTA:-200}
      QUARANTINE_MAX_MB: ${QUARANTINE_MAX_MB:-2048}
      QUARANTINE_RETENTION_DAYS: ${QUARANTINE_RETENTION_DAYS:-90}
      API_ALLOWED_HOSTS: ${API_ALLOWED_HOSTS:-}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-}
      INDICATORS_IGNORE: ${INDICATORS_IGNORE:-}
      EGRESS_PROXY_URL: ${EGRESS_PROXY_URL:-http://vpn:8888}
      EGRESS_PROXY_PASSWORD: ${EGRESS_PROXY_PASSWORD:-}
      EGRESS_CONTROL_URL: ${EGRESS_CONTROL_URL:-http://vpn:8000}
      EGRESS_ECHO_URLS: ${EGRESS_ECHO_URLS:-https://api.ipify.org,https://icanhazip.com}
      EGRESS_ALLOWED_CIDRS: ${EGRESS_ALLOWED_CIDRS:-}
      EGRESS_CHECK_INTERVAL_S: ${EGRESS_CHECK_INTERVAL_S:-300}
      VPN_WG_ENDPOINT_IP: ${VPN_WG_ENDPOINT_IP:-}
      VPN_WG_DNS: ${VPN_WG_DNS:-}
      # Verifier fetches for the network (M32): on only through ingest's verifier wiring in .env.
      COLLECTOR_VERIFY_ENABLED: ${COLLECTOR_VERIFY_ENABLED:-false}
    dns: ["127.0.0.1"]
    volumes:
      - quarantine:/quarantine
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    networks: [samples, egress-proxy]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 32
    restart: unless-stopped
    depends_on:
      vpn:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "collector.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Static analysis of quarantined files, in a resource-limited child process. No route to the
  # internet, Redis or ingest: it shares only the "samples" network (with db and collector).
  analyzer:
    profiles: [egress]
    image: ${SUCKERPOT_IMAGE_PREFIX:-local/${COMPOSE_PROJECT_NAME:-unset}}-collector:${SUCKERPOT_VERSION:-dev}
    build:
      context: .
      dockerfile: collector/Dockerfile
      args:
        VERSION: ${SUCKERPOT_BUILD_VERSION:-dev}
        BUILD_KIND: source
        COMMIT: ${SUCKERPOT_BUILD_COMMIT:-unknown}
    command: ["python", "-m", "collector", "analyze"]
    <<: *hardening
    user: "10001:10001"
    environment:
      <<: *db-env
      POSTGRES_USER: ${POSTGRES_ANALYZER_USER:-suckerpot_analyzer}
      POSTGRES_PASSWORD: ${POSTGRES_ANALYZER_PASSWORD:-}
      COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-false}
      COLLECTOR_POLL_S: ${COLLECTOR_POLL_S:-15}
      COLLECTOR_MAX_DEPTH: ${COLLECTOR_MAX_DEPTH:-2}
      COLLECTOR_DENY_CIDRS: ${COLLECTOR_DENY_CIDRS:-}
      ANALYZER_TIMEOUT_S: ${ANALYZER_TIMEOUT_S:-60}
      ANALYZER_MEMORY_MB: ${ANALYZER_MEMORY_MB:-384}
      API_ALLOWED_HOSTS: ${API_ALLOWED_HOSTS:-}
      INDICATORS_IGNORE: ${INDICATORS_IGNORE:-}
    dns: ["127.0.0.1"]
    volumes:
      - quarantine:/quarantine:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    networks: [samples]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 16
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "collector.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Synthetic attack generator. Publishes to Redis as the restricted "sensor" user.
  # Run with: docker compose --profile tools run --rm demo [args]
  demo:
    profiles: [tools]
    image: ${SUCKERPOT_IMAGE_PREFIX:-local/${COMPOSE_PROJECT_NAME:-unset}}-demo:${SUCKERPOT_VERSION:-dev}
    build:
      context: .
      dockerfile: scripts/demo/Dockerfile
      args:
        VERSION: ${SUCKERPOT_BUILD_VERSION:-dev}
        BUILD_KIND: source
        COMMIT: ${SUCKERPOT_BUILD_COMMIT:-unknown}
    <<: *hardening
    user: "10001:10001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USER: demo
      REDIS_PASSWORD: ${REDIS_DEMO_PASSWORD:?REDIS_DEMO_PASSWORD must be set in .env}
      # Larger than the sensors' cap: a backfill writes faster than ingest reads, and a
      # tight MAXLEN would trim entries that were not consumed yet.
      EVENTS_MAXLEN: ${DEMO_EVENTS_MAXLEN:-100000}
      EVENTS_MAX_BYTES_PER_SEC: "0"  # demo backfill only; real sensors keep the byte budget
      DEMO_DAYS: ${DEMO_DAYS:-30}
      DEMO_SESSIONS: ${DEMO_SESSIONS:-3000}
      DEMO_SEED: ${DEMO_SEED:-42}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    networks: [tools]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy

networks:
  # Inbound-only network for every internet-facing sensor. Published ports work,
  # but containers get no outbound route (masquerading off) and cannot talk to
  # each other (inter-container communication off).
  ingress:
    name: sp-ingress
    driver_opts:
      com.docker.network.bridge.name: sp-ingress
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"
  # SSH sensor <-> Redis only. No route to anything else.
  sensors-ssh:
    internal: true
  # RDP sensor <-> Redis only.
  sensors-rdp:
    internal: true
  # Telnet sensor <-> Redis only.
  sensors-telnet:
    internal: true
  # Web sensor <-> Redis only.
  sensors-web:
    internal: true
  # REDIS sensor <-> Redis only.
  sensors-redis:
    internal: true
  # Docker sensor <-> Redis only.
  sensors-docker:
    internal: true
  # MYSQL sensor <-> Redis only.
  sensors-mysql:
    internal: true
  # MSSQL sensor <-> Redis only.
  sensors-mssql:
    internal: true
  # ADB sensor <-> Redis only.
  sensors-adb:
    internal: true
  # SMB sensor <-> Redis only.
  sensors-smb:
    internal: true
  # SIP sensor <-> Redis only.
  sensors-sip:
    internal: true
  # Synology sensor <-> Redis only.
  sensors-synology:
    internal: true
  # Demo generator <-> Redis only.
  tools:
    internal: true
  # Redis, database, ingest and API. No route to the internet.
  backend:
    internal: true
  # The only route to the internet: the vpn container's uplink (WireGuard to one endpoint).
  # Masquerading stays on so the tunnel handshake can leave; the host firewall
  # (scripts/host/firewall.nft) restricts sp-vpn to that one endpoint.
  vpn-uplink:
    name: sp-vpn
    driver_opts:
      com.docker.network.bridge.name: sp-vpn
      com.docker.network.bridge.enable_icc: "false"
  # vpn <-> ingest <-> collector: the HTTP proxy and the control server. Internal.
  egress-proxy:
    internal: true
    driver_opts:
      # Named so the host firewall can drop its traffic to the host (the gateway is the host).
      com.docker.network.bridge.name: sp-egress
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  # Participant mode without a VPN (M32): hubproxy's uplink, the only route out in that mode.
  # Masquerading stays on so the proxy can reach the hub; the host firewall (scripts/host/firewall.nft)
  # restricts sp-hubgate to TCP 443. Members: hubproxy only.
  hub-uplink:
    name: sp-hubgate
    driver_opts:
      com.docker.network.bridge.name: sp-hubgate
      com.docker.network.bridge.enable_icc: "false"
  # hubproxy <-> ingest (participant overlay): the proxy and control server. Internal.
  hub-proxy:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: sp-hubproxy
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  # db <-> collector <-> analyzer. Keeps both away from Redis, ingest and the API.
  samples:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: sp-samples
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  # Inbound-only network for the API: masquerading is off, so the published
  # dashboard port works but the API container cannot reach the internet.
  dashboard:
    name: sp-dashboard
    driver_opts:
      com.docker.network.bridge.name: sp-dashboard
      com.docker.network.bridge.enable_ip_masquerade: "false"

# Every data volume is EXTERNAL, named <SUCKERPOT_VOLUME_PREFIX>_<volume> (live: suckerpot_<volume>), so `docker compose down -v`, a different
# project name or a throwaway checkout can never delete or silently recreate the live data.
# SUCKERPOT_VOLUME_PREFIX is REQUIRED (it comes from .env; Compose itself would fill in
# COMPOSE_PROJECT_NAME from the folder name, so that one cannot fail closed): a checkout without .env cannot run
# compose at all, so it can never mount the live volumes by accident.
# `just up` (scripts/ensure-volumes.sh) creates the missing ones first. The test overlays
# (docker-compose.it.yml, docker-compose.ci.yml) turn every one of them back into a
# project-local volume. To delete data on purpose, see docs/deployment.md ("Deleting data").
volumes:
  redis-data:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_redis-data
  db-data:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_db-data
  ssh-hostkeys:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_ssh-hostkeys
  rdp-data:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_rdp-data
  telnet-data:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_telnet-data
  web-data:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_web-data
  redis-sensor-data:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_redis-sensor-data
  docker-sensor-data:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_docker-sensor-data
  mysql-sensor-data:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_mysql-sensor-data
  mssql-sensor-data:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_mssql-sensor-data
  adb-sensor-data:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_adb-sensor-data
  smb-sensor-data:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_smb-sensor-data
  sip-sensor-data:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_sip-sensor-data
  synology-sensor-data:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_synology-sensor-data
  geoip-data:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_geoip-data
  # Files fetched by the collector (0400, never executed). Read-only for analyzer and api.
  quarantine:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_quarantine
  # Uploaded WireGuard settings (M23): read-write in api, read-only in vpn only. Its initial owner
  # comes from the /vpn-config directory of the api image (uid 10001).
  vpn-config:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_vpn-config
  # Daily database dumps written by the backup service (owned by uid 70, see ensure-volumes.sh).
  backups:
    external: true
    name: ${SUCKERPOT_VOLUME_PREFIX:?SUCKERPOT_VOLUME_PREFIX must be set in .env}_backups
