# SuckerPot, milestone M1: event pipeline (Redis -> ingest -> TimescaleDB -> API).
# Internet-facing sensors live on their own "ingress" network plus one internal
# network each to reach Redis, and nothing else.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Applied to every service. Individual services add tmpfs mounts and limits.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *default-logging

# Connection settings shared by all database clients. Each service adds its own
# POSTGRES_USER / POSTGRES_PASSWORD: only db and migrate see the owner account.
x-db-env: &db-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-suckerpot}

services:
  redis:
    image: ${SUCKERPOT_IMAGE_PREFIX:-local/${COMPOSE_PROJECT_NAME:-unset}}-redis:${SUCKERPOT_VERSION:-dev}
    build:
      context: ./redis
      args:
        VERSION: ${SUCKERPOT_BUILD_VERSION:-dev}
        BUILD_KIND: source
        COMMIT: ${SUCKERPOT_BUILD_COMMIT:-unknown}
    <<: *hardening
    # The image's own "redis" user (uid 999). The /data volume is initialised
    # from the image, so it is already owned by that user: no root, no capabilities.
    user: "999:999"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDIS_SENSOR_SSH_PASSWORD: ${REDIS_SENSOR_SSH_PASSWORD:?REDIS_SENSOR_SSH_PASSWORD must be set in .env}
      REDIS_SENSOR_RDP_PASSWORD: ${REDIS_SENSOR_RDP_PASSWORD:?REDIS_SENSOR_RDP_PASSWORD must be set in .env}
      REDIS_SENSOR_TELNET_PASSWORD: ${REDIS_SENSOR_TELNET_PASSWORD:?REDIS_SENSOR_TELNET_PASSWORD must be set in .env}
      REDIS_SENSOR_WEB_PASSWORD: ${REDIS_SENSOR_WEB_PASSWORD:?REDIS_SENSOR_WEB_PASSWORD must be set in .env}
      REDIS_SENSOR_REDIS_PASSWORD: ${REDIS_SENSOR_REDIS_PASSWORD:?REDIS_SENSOR_REDIS_PASSWORD must be set in .env}
      REDIS_SENSOR_DOCKER_PASSWORD: ${REDIS_SENSOR_DOCKER_PASSWORD:?REDIS_SENSOR_DOCKER_PASSWORD must be set in .env}
      REDIS_SENSOR_MYSQL_PASSWORD: ${REDIS_SENSOR_MYSQL_PASSWORD:?REDIS_SENSOR_MYSQL_PASSWORD must be set in .env}
      REDIS_SENSOR_MSSQL_PASSWORD: ${REDIS_SENSOR_MSSQL_PASSWORD:?REDIS_SENSOR_MSSQL_PASSWORD must be set in .env}
      REDIS_SENSOR_ADB_PASSWORD: ${REDIS_SENSOR_ADB_PASSWORD:?REDIS_SENSOR_ADB_PASSWORD must be set in .env}
      REDIS_SENSOR_SMB_PASSWORD: ${REDIS_SENSOR_SMB_PASSWORD:?REDIS_SENSOR_SMB_PASSWORD must be set in .env}
      REDIS_SENSOR_SIP_PASSWORD: ${REDIS_SENSOR_SIP_PASSWORD:?REDIS_SENSOR_SIP_PASSWORD must be set in .env}
      REDIS_SENSOR_SYNOLOGY_PASSWORD: ${REDIS_SENSOR_SYNOLOGY_PASSWORD:?REDIS_SENSOR_SYNOLOGY_PASSWORD must be set in .env}
      REDIS_DEMO_PASSWORD: ${REDIS_DEMO_PASSWORD:?REDIS_DEMO_PASSWORD must be set in .env}
      REDIS_INGEST_PASSWORD: ${REDIS_INGEST_PASSWORD:?REDIS_INGEST_PASSWORD must be set in .env}
      REDIS_HEALTH_PASSWORD: ${REDIS_HEALTH_PASSWORD:?REDIS_HEALTH_PASSWORD must be set in .env}
      SUCKERPOT_ALLOW_DEFAULT_SECRETS: ${SUCKERPOT_ALLOW_DEFAULT_SECRETS:-0}
      # Memory cap in MiB (redis.conf says 192); the low-memory overlay lowers it.
      REDIS_MAXMEMORY_MB: ${REDIS_MAXMEMORY_MB:-192}
    volumes:
      - redis-data:/data
    tmpfs:
      # Generated ACL file (mode 0600, hashed passwords).
      - /run/redis:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=999,gid=999
    networks:
      [sensors-ssh, sensors-rdp, sensors-telnet, sensors-web, sensors-redis, sensors-docker, sensors-mysql, sensors-mssql, sensors-adb, sensors-smb, sensors-sip, sensors-synology, tools, backend]
    mem_limit: 384m
    memswap_limit: 384m
    oom_score_adj: -500
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_HEALTH_PASSWORD" redis-cli --user health ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: timescale/timescaledb:2.22.1-pg17
    <<: *hardening
    # Run directly as the image's "postgres" user (uid 70) instead of starting as
    # root and dropping privileges. The data volume is initialised from the image
    # and owned by that user, so no CHOWN/SETUID/SETGID/DAC_OVERRIDE/FOWNER capability is needed.
    user: "70:70"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suckerpot}
      POSTGRES_USER: ${POSTGRES_USER:-suckerpot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    # Tuned for a 4 GB VM shared with the other services.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
      - -c
      - timescaledb.max_background_workers=4
      - -c
      - timescaledb.telemetry_level=off
      - -c
      - log_min_duration_statement=1000
    volumes:
      - db-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=70,gid=70
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=1m,uid=70,gid=70
    # "samples" lets the collector and analyzer (profile egress) reach the database.
    networks: [backend, samples]
    shm_size: 256m
    mem_limit: 1g
    memswap_limit: 1g
    oom_score_adj: -500
    cpus: 1.0
    pids_limit: 200
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -q -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    image: ${SUCKERPOT_IMAGE_PREFIX:-local/${COMPOSE_PROJECT_NAME:-unset}}-migrate:${SUCKERPOT_VERSION:-dev}
    build:
      context: .
      dockerfile: db/Dockerfile
      args:
        VERSION: ${SUCKERPOT_BUILD_VERSION:-dev}
        BUILD_KIND: source
        COMMIT: ${SUCKERPOT_BUILD_COMMIT:-unknown}
    <<: *hardening
    user: "10001:10001"
    environment:
      <<: *db-env
      # Owner account (schema changes) plus the passwords of the restricted roles it creates.
      POSTGRES_USER: ${POSTGRES_USER:-suckerpot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INGEST_USER: ${POSTGRES_INGEST_USER:-suckerpot_ingest}
      POSTGRES_INGEST_PASSWORD: ${POSTGRES_INGEST_PASSWORD:?POSTGRES_INGEST_PASSWORD must be set in .env}
      POSTGRES_API_USER: ${POSTGRES_API_USER:-suckerpot_api}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD must be set in .env}
      # Roles of the collector and analyzer (profile "egress"). Required when the profile is on
      # (scripts/check-vpn-env.sh); empty otherwise.
      POSTGRES_COLLECTOR_USER: ${POSTGRES_COLLECTOR_USER:-suckerpot_collector}
      POSTGRES_COLLECTOR_PASSWORD: ${POSTGRES_COLLECTOR_PASSWORD:-}
      POSTGRES_ANALYZER_USER: ${POSTGRES_ANALYZER_USER:-suckerpot_analyzer}
      POSTGRES_ANALYZER_PASSWORD: ${POSTGRES_ANALYZER_PASSWORD:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      ABUSE_REPORT_RETENTION_DAYS: ${ABUSE_REPORT_RETENTION_DAYS:-730}
      ABUSE_REPLY_EXCERPT_DAYS: ${ABUSE_REPLY_EXCERPT_DAYS:-180}
      TAKEDOWN_CHECK_RETENTION_DAYS: ${TAKEDOWN_CHECK_RETENTION_DAYS:-400}
      INDICATORS_MAX_ROWS: ${INDICATORS_MAX_ROWS:-500000}
      CAMPAIGNS_MAX_ROWS: ${CAMPAIGNS_MAX_ROWS:-50000}
      SCRIPTS_MAX_ROWS: ${SCRIPTS_MAX_ROWS:-100000}
      DB_MAX_SIZE_GB: ${DB_MAX_SIZE_GB:-10}
      SUCKERPOT_ALLOW_DEFAULT_SECRETS: ${SUCKERPOT_ALLOW_DEFAULT_SECRETS:-0}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    networks: [backend]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # Daily database dump into the external `backups` volume (7 kept). Backend network only: no
  # route out. It uses the database OWNER account (like `migrate`), because pg_dump needs to read
  # every table; a dedicated read-only role is possible later. The image ships a matching pg_dump.
  backup:
    image: timescale/timescaledb:2.22.1-pg17
    <<: *hardening
    user: "70:70"
    entrypoint: ["/bin/sh", "/backup-service.sh"]
    environment:
      <<: *db-env
      POSTGRES_USER: ${POSTGRES_USER:-suckerpot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./scripts/backup-service.sh:/backup-service.sh:ro
      - backups:/backups
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,uid=70,gid=70
    networks: [backend]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      # A dump younger than 26 h, and no "shrunk" marker (a dump under half of the largest one).
      test: ["CMD-SHELL", "! test -e /backups/.shrunk && find /backups -maxdepth 1 -name 'suckerpot-*.dump' -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 10m
      # While the first dump runs, probe often so `up --wait` is not held for a whole interval.
      start_interval: 15s
    depends_on:
      db:
        condition: service_healthy

  ingest:
    image: ${SUCKERPOT_IMAGE_PREFIX:-local/${COMPOSE_PROJECT_NAME:-unset}}-ingest:${SUCKERPOT_VERSION:-dev}
    build:
      context: .
      dockerfile: ingest/Dockerfile
      args:
        VERSION: ${SUCKERPOT_BUILD_VERSION:-dev}
        BUILD_KIND: source
        COMMIT: ${SUCKERPOT_BUILD_COMMIT:-unknown}
    <<: *hardening
    user: "10001:10001"
    environment:
      <<: *db-env
      POSTGRES_USER: ${POSTGRES_INGEST_USER:-suckerpot_ingest}
      POSTGRES_PASSWORD: ${POSTGRES_INGEST_PASSWORD:?POSTGRES_INGEST_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USER: ingest
      REDIS_PASSWORD: ${REDIS_INGEST_PASSWORD:?REDIS_INGEST_PASSWORD must be set in .env}
      INGEST_STREAMS: ${INGEST_STREAMS:-events:ssh,events:telnet,events:web,events:rdp,events:redis,events:docker,events:mysql,events:mssql,events:adb,events:smb,events:sip,events:synology}
      DB_MAX_SIZE_GB: ${DB_MAX_SIZE_GB:-10}
      GEOIP_PROVIDER: ${GEOIP_PROVIDER:-auto}
      GEOIP_REFRESH_DAYS: ${GEOIP_REFRESH_DAYS:-30}
      GEOIP_FAKE_FOR_PRIVATE: ${GEOIP_FAKE_FOR_PRIVATE:-false}
      MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      GREYNOISE_API_KEY: ${GREYNOISE_API_KEY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      GITHUB_ADVISORY_TOKEN: ${GITHUB_ADVISORY_TOKEN:-}
      CVE_WATCH_ENABLED: ${CVE_WATCH_ENABLED:-true}
      CVE_NVD_DAILY_QUOTA: ${CVE_NVD_DAILY_QUOTA:-200}
      CVE_GITHUB_DAILY_QUOTA: ${CVE_GITHUB_DAILY_QUOTA:-100}
      # Decrypts the keys saved from the Settings page (empty = only the .env keys are used).
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      ABUSEIPDB_DAILY_QUOTA: ${ABUSEIPDB_DAILY_QUOTA:-1000}
      GREYNOISE_DAILY_QUOTA: ${GREYNOISE_DAILY_QUOTA:-50}
      REPUTATION_MIN_EVENTS: ${REPUTATION_MIN_EVENTS:-10}
      REPUTATION_INTERVAL_S: ${REPUTATION_INTERVAL_S:-30}
      # Indicators and threat intelligence (M13): passive lookups, fixed API hosts only.
      ABUSECH_AUTH_KEY: ${ABUSECH_AUTH_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSECH_DAILY_QUOTA: ${ABUSECH_DAILY_QUOTA:-1000}
      VIRUSTOTAL_DAILY_QUOTA: ${VIRUSTOTAL_DAILY_QUOTA:-400}
      INTEL_INTERVAL_S: ${INTEL_INTERVAL_S:-30}
      INDICATORS_ENABLED: ${INDICATORS_ENABLED:-true}
      INDICATORS_IGNORE: ${INDICATORS_IGNORE:-}
      # Never-block list (M16): also reads API_ALLOWED_HOSTS and AUTH_TRUSTED_PROXIES.
      BLOCKLIST_NEVER: ${BLOCKLIST_NEVER:-}
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-}
      INDICATORS_KEEP_DOCUMENTATION: ${INDICATORS_KEEP_DOCUMENTATION:-false}
      # Daily check for a newer release (M28): one anonymous GET through the egress proxy.
      UPDATE_CHECK_ENABLED: ${UPDATE_CHECK_ENABLED:-false}
      UPDATE_CHECK_REPO: ${UPDATE_CHECK_REPO:-Theroxat/suckerpot}
      # This deployment's own names: never recorded as attack infrastructure.
      API_ALLOWED_HOSTS: ${API_ALLOWED_HOSTS:-}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-}
      INDICATORS_LINK_CAP: ${INDICATORS_LINK_CAP:-500}
      # Campaigns, ATT&CK, blocklists, scripts, LLM explanations, alerts and reports (M15 to M19).
      # Everything is off by default; the keys are optional and can also be set in Settings.
      ATTACK_ENABLED: ${ATTACK_ENABLED:-false}
      CAMPAIGNS_ENABLED: ${CAMPAIGNS_ENABLED:-false}
      CAMPAIGN_MIN_SOURCES: ${CAMPAIGN_MIN_SOURCES:-2}
      CAMPAIGN_LINK_CAP: ${CAMPAIGN_LINK_CAP:-500}
      BLOCKLIST_ENABLED: ${BLOCKLIST_ENABLED:-false}
      BLOCKLIST_WINDOW_DAYS: ${BLOCKLIST_WINDOW_DAYS:-30}
      BLOCKLIST_MAX_ROWS: ${BLOCKLIST_MAX_ROWS:-20000}
      SCRIPTS_ENABLED: ${SCRIPTS_ENABLED:-false}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_DAILY_QUOTA: ${LLM_DAILY_QUOTA:-50}
      LLM_MONTHLY_TOKEN_CAP: ${LLM_MONTHLY_TOKEN_CAP:-2000000}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-false}
      REPORTS_ENABLED: ${REPORTS_ENABLED:-false}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      ALERTS_DASHBOARD_URL: ${ALERTS_DASHBOARD_URL:-}
      SITE_TIMEZONE: ${SITE_TIMEZONE:-UTC}
      # Anonymous abuse reporting (M22): off by default. Drafts only; nothing is ever sent.
      ABUSE_REPORTS_ENABLED: ${ABUSE_REPORTS_ENABLED:-false}
      ABUSE_BUILD_INTERVAL_S: ${ABUSE_BUILD_INTERVAL_S:-3600}
      ABUSE_MIN_LOGIN_ATTEMPTS: ${ABUSE_MIN_LOGIN_ATTEMPTS:-50}
      ABUSE_SEVERE_TAGS: ${ABUSE_SEVERE_TAGS:-}
      ABUSE_LOOKBACK_DAYS: ${ABUSE_LOOKBACK_DAYS:-7}
      ABUSE_SETTLE_MIN: ${ABUSE_SETTLE_MIN:-30}
      ABUSE_RESEND_DAYS: ${ABUSE_RESEND_DAYS:-14}
      # The opt-in Selfhostr network (M29): off by default; joining also needs an admin's
      # opt-in in the dashboard. Every call goes through the VPN egress gate.
      NETWORK_ENABLED: ${NETWORK_ENABLED:-false}
      NETWORK_HUB_URL: ${NETWORK_HUB_URL:-}
      NETWORK_HUB_KEY: ${NETWORK_HUB_KEY:-}
      NETWORK_INTERVAL_S: ${NETWORK_INTERVAL_S:-900}
      NETWORK_SUBMIT_DELAY_MIN_H: ${NETWORK_SUBMIT_DELAY_MIN_H:-2}
      NETWORK_SUBMIT_DELAY_MAX_H: ${NETWORK_SUBMIT_DELAY_MAX_H:-20}
      NETWORK_MAX_SOURCES: ${NETWORK_MAX_SOURCES:-5000}
      # The public community blocklist feed (M30): off by default, independent of membership.
      # Every download goes through the VPN egress gate; the signature is checked against the key.
      NETWORK_FEED_ENABLED: ${NETWORK_FEED_ENABLED:-false}
      NETWORK_FEED_URL: ${NETWORK_FEED_URL:-}
      NETWORK_FEED_KEY: ${NETWORK_FEED_KEY:-}
      NETWORK_FEED_INTERVAL_S: ${NETWORK_FEED_INTERVAL_S:-3600}
      NETWORK_FEED_LISTS: ${NETWORK_FEED_LISTS:-inbound,outbound,outbound-domains}
      ABUSE_MAX_SUBJECTS: ${ABUSE_MAX_SUBJECTS:-100}
      ABUSE_MAX_OPEN_DRAFTS: ${ABUSE_MAX_OPEN_DRAFTS:-200}
      ABUSE_RDAP_DAILY_QUOTA: ${ABUSE_RDAP_DAILY_QUOTA:-1000}
      ABUSE_RDAP_HOURLY_QUOTA: ${ABUSE_RDAP_HOURLY_QUOTA:-200}
      ABUSE_REPORTS_INCLUDE_DEMO: ${ABUSE_REPORTS_INCLUDE_DEMO:-false}
      ABUSE_ROUND_TIMES: ${ABUSE_ROUND_TIMES:-true}
      # Replies to reports (M26): the mailbox itself is saved in Settings, never here.
      ABUSE_REPLIES_ENABLED: ${ABUSE_REPLIES_ENABLED:-false}
      ABUSE_REPLY_MAX_BYTES: ${ABUSE_REPLY_MAX_BYTES:-262144}
      ABUSE_REPLY_MAX_PER_POLL: ${ABUSE_REPLY_MAX_PER_POLL:-50}
      ABUSE_REPLY_DAILY_CAP: ${ABUSE_REPLY_DAILY_CAP:-500}
      ABUSE_REPLY_POLL_DEADLINE_S: ${ABUSE_REPLY_POLL_DEADLINE_S:-120}
      ABUSE_REPLY_EXCERPT_CHARS: ${ABUSE_REPLY_EXCERPT_CHARS:-2000}
      ABUSE_REPLY_MATCH_DAYS: ${ABUSE_REPLY_MATCH_DAYS:-120}
      # Takedown tracking and abuse.ch submission (M27): both off by default. Submission also
      # needs the owner's mode in Settings (off by default).
      TAKEDOWN_ENABLED: ${TAKEDOWN_ENABLED:-false}
      TAKEDOWN_TRACK_DAYS: ${TAKEDOWN_TRACK_DAYS:-30}
      TAKEDOWN_INTEL_DAILY_QUOTA: ${TAKEDOWN_INTEL_DAILY_QUOTA:-100}
      TAKEDOWN_ABUSEIPDB_DAILY_QUOTA: ${TAKEDOWN_ABUSEIPDB_DAILY_QUOTA:-50}
      TAKEDOWN_QUIET_DAYS: ${TAKEDOWN_QUIET_DAYS:-7}
      TAKEDOWN_INTERVAL_S: ${TAKEDOWN_INTERVAL_S:-600}
      ABUSECH_SUBMIT_ENABLED: ${ABUSECH_SUBMIT_ENABLED:-false}
      # Published sensor ports: reports name the port the source connected to (read-only use).
      SSH_HOST_PORT: ${SSH_HOST_PORT:-22}
      TELNET_HOST_PORT: ${TELNET_HOST_PORT:-23}
      HTTP_HOST_PORT: ${HTTP_HOST_PORT:-80}
      HTTPS_HOST_PORT: ${HTTPS_HOST_PORT:-443}
      RDP_HOST_PORT: ${RDP_HOST_PORT:-3389}
      REDIS_HOST_PORT: ${REDIS_HOST_PORT:-6379}
      DOCKER_HOST_PORT: ${DOCKER_HOST_PORT:-2375}
      MYSQL_HOST_PORT: ${MYSQL_HOST_PORT:-3306}
      MSSQL_HOST_PORT: ${MSSQL_HOST_PORT:-1433}
      ADB_HOST_PORT: ${ADB_HOST_PORT:-5555}
      SMB_HOST_PORT: ${SMB_HOST_PORT:-445}
      SIP_HOST_PORT: ${SIP_HOST_PORT:-5060}
      SYNOLOGY_HTTP_HOST_PORT: ${SYNOLOGY_HTTP_HOST_PORT:-5000}
      SYNOLOGY_HTTPS_HOST_PORT: ${SYNOLOGY_HTTPS_HOST_PORT:-5001}
      # Names the sensors present as their own: part of the deny set of the abuse-report guard.
      SSH_HOSTNAME: ${SSH_HOSTNAME:-srv-web01}
      RDP_HOSTNAME: ${RDP_HOSTNAME:-}
      SMB_HOSTNAME: ${SMB_HOSTNAME:-}
      SMB_DOMAIN: ${SMB_DOMAIN:-}
      WEB_HOSTNAME: ${WEB_HOSTNAME:-srv-web01}
      # Anonymous egress (M21): every outbound request goes through the vpn HTTP proxy. No
      # HTTP(S)_PROXY variable is set on purpose: the clients use the suckerpot_egress factory.
      EGRESS_PROXY_URL: ${EGRESS_PROXY_URL:-http://vpn:8888}
      EGRESS_PROXY_PASSWORD: ${EGRESS_PROXY_PASSWORD:-}
      EGRESS_CONTROL_URL: ${EGRESS_CONTROL_URL:-http://vpn:8000}
      EGRESS_ECHO_URLS: ${EGRESS_ECHO_URLS:-https://api.ipify.org,https://icanhazip.com}
      EGRESS_ALLOWED_CIDRS: ${EGRESS_ALLOWED_CIDRS:-}
      EGRESS_DENY_ASNS: ${EGRESS_DENY_ASNS:-}
      EGRESS_CHECK_INTERVAL_S: ${EGRESS_CHECK_INTERVAL_S:-300}
      VPN_WG_ENDPOINT_IP: ${VPN_WG_ENDPOINT_IP:-}
      VPN_WG_DNS: ${VPN_WG_DNS:-}
      # Participant mode (M32): full-mode defaults keep today's behaviour. EGRESS_MODE=direct goes
      # with EGRESS_PROXY_URL / EGRESS_CONTROL_URL pointing at hubproxy (written by the installer).
      SUCKERPOT_STACK_MODE: ${SUCKERPOT_STACK_MODE:-full}
      EGRESS_MODE: ${EGRESS_MODE:-vpn}
      NETWORK_CONSENT: ${NETWORK_CONSENT:-}
      NETWORK_PSEUDONYM: ${NETWORK_PSEUDONYM:-}
      NETWORK_COUNTRY: ${NETWORK_COUNTRY:-}
      NETWORK_SHOW_COUNTRY: ${NETWORK_SHOW_COUNTRY:-false}
      NETWORK_VERIFY_REVEALS: ${NETWORK_VERIFY_REVEALS:-false}
      NETWORK_VERIFIER: ${NETWORK_VERIFIER:-false}
      NETWORK_VERIFY_DAILY_CAP: ${NETWORK_VERIFY_DAILY_CAP:-100}
      NETWORK_VERIFY_HOST_DAILY_CAP: ${NETWORK_VERIFY_HOST_DAILY_CAP:-3}
      SELF_TERMS_AUTO_CONFIRM: ${SELF_TERMS_AUTO_CONFIRM:-false}
      SELF_ADDRESS: ${SELF_ADDRESS:-}
    volumes:
      # GeoIP databases downloaded by ingest (the only writable path besides /tmp).
      - geoip-data:/data/geoip
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    # Both networks are internal. External names do not resolve here (Docker's embedded
    # resolver still answers service names); the only way out is the vpn proxy.
    dns: ["127.0.0.1"]
    networks: [backend, egress-proxy]
    mem_limit: 384m
    memswap_limit: 384m
    oom_score_adj: -200
    cpus: 1.0
    pids_limit: 100
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "ingest.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    image: ${SUCKERPOT_IMAGE_PREFIX:-local/${COMPOSE_PROJECT_NAME:-unset}}-api:${SUCKERPOT_VERSION:-dev}
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        VERSION: ${SUCKERPOT_BUILD_VERSION:-dev}
        BUILD_KIND: source
        COMMIT: ${SUCKERPOT_BUILD_COMMIT:-unknown}
    <<: *hardening
    user: "10001:10001"
    environment:
      <<: *db-env
      POSTGRES_USER: ${POSTGRES_API_USER:-suckerpot_api}
      POSTGRES_PASSWORD: ${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD must be set in .env}
      API_ENABLE_DOCS: ${API_ENABLE_DOCS:-false}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-}
      # Dashboard authentication. The API refuses to start without a valid
      # password hash and a strong session secret (unless the demo switches are used).
      # Where the live globe's arcs land. Country level only; empty = API defaults.
      SITE_HOME_LAT: ${SITE_HOME_LAT:-}
      SITE_HOME_LON: ${SITE_HOME_LON:-}
      SITE_HOME_LABEL: ${SITE_HOME_LABEL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH must be set in .env (docker compose run --rm api python -m api.hashpw)}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env (openssl rand -base64 48)}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # Encrypts the enrichment keys entered in Settings (empty = editing them there is disabled).
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOGIN_RATE: ${LOGIN_RATE:-5}
      LOGIN_RATE_GLOBAL: ${LOGIN_RATE_GLOBAL:-30}
      LOGIN_RATE_USER: ${LOGIN_RATE_USER:-10}
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-}
      API_ALLOWED_HOSTS: ${API_ALLOWED_HOSTS:-}
      # Setup checklist and wizard (M28): which sensors are on and which ports the owner must forward.
      SENSOR_SSH: ${SENSOR_SSH:-1}
      SENSOR_TELNET: ${SENSOR_TELNET:-1}
      SENSOR_WEB: ${SENSOR_WEB:-1}
      SENSOR_RDP: ${SENSOR_RDP:-1}
      SENSOR_REDIS: ${SENSOR_REDIS:-1}
      SENSOR_DOCKER: ${SENSOR_DOCKER:-1}
      SENSOR_MYSQL: ${SENSOR_MYSQL:-1}
      SENSOR_MSSQL: ${SENSOR_MSSQL:-1}
      SENSOR_ADB: ${SENSOR_ADB:-1}
      SENSOR_SMB: ${SENSOR_SMB:-1}
      SENSOR_SIP: ${SENSOR_SIP:-1}
      SENSOR_SYNOLOGY: ${SENSOR_SYNOLOGY:-1}
      SSH_HOST_PORT: ${SSH_HOST_PORT:-22}
      TELNET_HOST_PORT: ${TELNET_HOST_PORT:-23}
      HTTP_HOST_PORT: ${HTTP_HOST_PORT:-80}
      HTTPS_HOST_PORT: ${HTTPS_HOST_PORT:-443}
      RDP_HOST_PORT: ${RDP_HOST_PORT:-3389}
      REDIS_HOST_PORT: ${REDIS_HOST_PORT:-6379}
      DOCKER_HOST_PORT: ${DOCKER_HOST_PORT:-2375}
      MYSQL_HOST_PORT: ${MYSQL_HOST_PORT:-3306}
      MSSQL_HOST_PORT: ${MSSQL_HOST_PORT:-1433}
      ADB_HOST_PORT: ${ADB_HOST_PORT:-5555}
      SMB_HOST_PORT: ${SMB_HOST_PORT:-445}
      SIP_HOST_PORT: ${SIP_HOST_PORT:-5060}
      SYNOLOGY_HTTP_HOST_PORT: ${SYNOLOGY_HTTP_HOST_PORT:-5000}
      SYNOLOGY_HTTPS_HOST_PORT: ${SYNOLOGY_HTTPS_HOST_PORT:-5001}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8443}
      # Update check (M28): the version shown in Settings; ingest does the daily lookup.
      UPDATE_CHECK_ENABLED: ${UPDATE_CHECK_ENABLED:-false}
      UPDATE_CHECK_REPO: ${UPDATE_CHECK_REPO:-Theroxat/suckerpot}
      # Machine-readable blocklist feeds (M16), outside /api/v1 and off by default.
      FEEDS_ENABLED: ${FEEDS_ENABLED:-false}
      # Egress card in Settings (quota meter and quarantine cap).
      # Reported in the setup checklist only.
      COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-false}
      ABUSE_REPORTS_ENABLED: ${ABUSE_REPORTS_ENABLED:-false}
      ABUSE_REPLIES_ENABLED: ${ABUSE_REPLIES_ENABLED:-false}
      ABUSE_NO_ANSWER_DAYS: ${ABUSE_NO_ANSWER_DAYS:-14}
      TAKEDOWN_ENABLED: ${TAKEDOWN_ENABLED:-false}
      ABUSECH_SUBMIT_ENABLED: ${ABUSECH_SUBMIT_ENABLED:-false}
      # Network (M29): the API only needs to know whether it is on and whether a hub is set.
      NETWORK_ENABLED: ${NETWORK_ENABLED:-false}
      NETWORK_HUB_URL: ${NETWORK_HUB_URL:-}
      NETWORK_HUB_KEY: ${NETWORK_HUB_KEY:-}
      # Feed (M30): the UI shows the public URLs to copy; the key stays in ingest.
      NETWORK_FEED_ENABLED: ${NETWORK_FEED_ENABLED:-false}
      NETWORK_FEED_URL: ${NETWORK_FEED_URL:-}
      COLLECTOR_DAILY_QUOTA: ${COLLECTOR_DAILY_QUOTA:-500}
      QUARANTINE_MAX_MB: ${QUARANTINE_MAX_MB:-2048}
      BLOCKLIST_NEVER: ${BLOCKLIST_NEVER:-}
      INDICATORS_IGNORE: ${INDICATORS_IGNORE:-}
      SITE_TIMEZONE: ${SITE_TIMEZONE:-UTC}
      # The abuse-report guard checks every artefact against the deny set: it needs the same
      # names and ranges as ingest (design M22, section 7.1).
      ALERTS_DASHBOARD_URL: ${ALERTS_DASHBOARD_URL:-}
      VPN_WG_ENDPOINT_IP: ${VPN_WG_ENDPOINT_IP:-}
      # Names the sensors present as their own: part of the deny set of the abuse-report guard.
      SSH_HOSTNAME: ${SSH_HOSTNAME:-srv-web01}
      RDP_HOSTNAME: ${RDP_HOSTNAME:-}
      SMB_HOSTNAME: ${SMB_HOSTNAME:-}
      SMB_DOMAIN: ${SMB_DOMAIN:-}
      WEB_HOSTNAME: ${WEB_HOSTNAME:-srv-web01}
      SUCKERPOT_ALLOW_DEFAULT_SECRETS: ${SUCKERPOT_ALLOW_DEFAULT_SECRETS:-0}
      VPN_CONFIG_DIR: /vpn-config
      EGRESS_DENY_ASNS: ${EGRESS_DENY_ASNS:-}
    # Docker's embedded DNS still answers for service names (it listens on
    # 127.0.0.11); external names fail, so the API cannot resolve the internet.
    dns: ["127.0.0.1"]
    ports:
      # The only published port. Never use a sensor port or the admin SSH port.
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8443}:8000"
    volumes:
      # Samples fetched by the collector, read-only (archive download of one sample).
      - quarantine:/quarantine:ro
      # Uploaded VPN settings (wg.env, meta.json): mounted read-write here and read-only in vpn.
      - vpn-config:/vpn-config
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    networks: [backend, dashboard]
    mem_limit: 512m
    memswap_limit: 512m
    oom_score_adj: 300
    cpus: 1.0
    pids_limit: 100
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "api.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # SSH sensor: pure emulation, never executes attacker input.
  sensor-ssh:
    image: ${SUCKERPOT_IMAGE_PREFIX:-local/${COMPOSE_PROJECT_NAME:-unset}}-sensor-ssh:${SUCKERPOT_VERSION:-dev}
    build:
      context: .
      dockerfile: sensors/ssh/Dockerfile
      args:
        VERSION: ${SUCKERPOT_BUILD_VERSION:-dev}
        BUILD_KIND: source
        COMMIT: ${SUCKERPOT_BUILD_COMMIT:-unknown}
    # 1 = on, 0 = off (SENSOR_SSH in .env). Replicas 0 creates no container and binds no port.
    deploy:
      replicas: ${SENSOR_SSH:-1}
    <<: *hardening
    user: "10001:10001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USER: sensor-ssh
      REDIS_PASSWORD: ${REDIS_SENSOR_SSH_PASSWORD:?REDIS_SENSOR_SSH_PASSWORD must be set in .env}
      EVENTS_STREAM: events:ssh
      EVENTS_MAXLEN: ${EVENTS_MAXLEN:-10000}
      EVENTS_MAX_BYTES_PER_SEC: ${EVENTS_MAX_BYTES_PER_SEC:-200000}
      EVENTS_MAX_BYTES_BURST: ${EVENTS_MAX_BYTES_BURST:-2000000}
      SSH_PORT: "2222"
      # Keep equal to mem_limit below: the sensor sheds load as it nears this figure.
      SSH_MEMORY_LIMIT_MB: "256"
      SSH_PUBLIC_PORT: ${SSH_HOST_PORT:-22}
      SSH_BANNER: ${SSH_BANNER:-SSH-2.0-OpenSSH_9.6p1 Ubuntu-3ubuntu13.14}
      SSH_HOSTNAME: ${SSH_HOSTNAME:-srv-web01}
      SSH_HOSTKEY_DIR: /data/host_keys
      SSH_ACCEPT_CREDENTIALS: ${SSH_ACCEPT_CREDENTIALS:-root:root,root:123456,root:password,admin:admin,ubuntu:ubuntu,pi:raspberry,user:user}
      SSH_ACCEPT_RANDOM_PROB: ${SSH_ACCEPT_RANDOM_PROB:-0.0}
      SSH_MAX_AUTH_ATTEMPTS: ${SSH_MAX_AUTH_ATTEMPTS:-6}
      SSH_MAX_CONNECTIONS: ${SSH_MAX_CONNECTIONS:-200}
      SSH_MAX_PER_IP: ${SSH_MAX_PER_IP:-5}
    # Compose maps the low host port to the high container port: no capability needed.
    # Explicit IPv4 so Docker does not also publish on [::].
    ports:
      - "0.0.0.0:${SSH_HOST_PORT:-22}:2222"
    # Docker's embedded DNS still resolves service names; external names fail.
    dns: ["127.0.0.1"]
    # ingress: inbound only. sensors-ssh: internal link to Redis.
    networks: [ingress, sensors-ssh]
    volumes:
      # Host keys, generated on first start. Never committed.
      - ssh-hostkeys:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    mem_limit: 256m
    memswap_limit: 256m  # no swap: overload fails fast instead of stalling the host
    oom_score_adj: 800
    cpu_shares: 256
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "ssh_sensor.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

