# SuckerPot, milestone M1: event pipeline (Redis -> ingest -> TimescaleDB -> API).
# Internet-facing sensors live on their own "ingress" network plus one internal
# network each to reach Redis, and nothing else.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Applied to every service. Individual services add tmpfs mounts and limits.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *default-logging

# Connection settings shared by all database clients. Each service adds its own
# POSTGRES_USER / POSTGRES_PASSWORD: only db and migrate see the owner account.
x-db-env: &db-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-suckerpot}

services:
  redis:
    build:
      context: ./redis
    <<: *hardening
    # The image's own "redis" user (uid 999). The /data volume is initialised
    # from the image, so it is already owned by that user: no root, no capabilities.
    user: "999:999"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDIS_SENSOR_SSH_PASSWORD: ${REDIS_SENSOR_SSH_PASSWORD:?REDIS_SENSOR_SSH_PASSWORD must be set in .env}
      REDIS_SENSOR_RDP_PASSWORD: ${REDIS_SENSOR_RDP_PASSWORD:?REDIS_SENSOR_RDP_PASSWORD must be set in .env}
      REDIS_SENSOR_TELNET_PASSWORD: ${REDIS_SENSOR_TELNET_PASSWORD:?REDIS_SENSOR_TELNET_PASSWORD must be set in .env}
      REDIS_SENSOR_WEB_PASSWORD: ${REDIS_SENSOR_WEB_PASSWORD:?REDIS_SENSOR_WEB_PASSWORD must be set in .env}
      REDIS_SENSOR_REDIS_PASSWORD: ${REDIS_SENSOR_REDIS_PASSWORD:?REDIS_SENSOR_REDIS_PASSWORD must be set in .env}
      REDIS_SENSOR_DOCKER_PASSWORD: ${REDIS_SENSOR_DOCKER_PASSWORD:?REDIS_SENSOR_DOCKER_PASSWORD must be set in .env}
      REDIS_SENSOR_MYSQL_PASSWORD: ${REDIS_SENSOR_MYSQL_PASSWORD:?REDIS_SENSOR_MYSQL_PASSWORD must be set in .env}
      REDIS_SENSOR_MSSQL_PASSWORD: ${REDIS_SENSOR_MSSQL_PASSWORD:?REDIS_SENSOR_MSSQL_PASSWORD must be set in .env}
      REDIS_SENSOR_ADB_PASSWORD: ${REDIS_SENSOR_ADB_PASSWORD:?REDIS_SENSOR_ADB_PASSWORD must be set in .env}
      REDIS_SENSOR_SMB_PASSWORD: ${REDIS_SENSOR_SMB_PASSWORD:?REDIS_SENSOR_SMB_PASSWORD must be set in .env}
      REDIS_SENSOR_SIP_PASSWORD: ${REDIS_SENSOR_SIP_PASSWORD:?REDIS_SENSOR_SIP_PASSWORD must be set in .env}
      REDIS_DEMO_PASSWORD: ${REDIS_DEMO_PASSWORD:?REDIS_DEMO_PASSWORD must be set in .env}
      REDIS_INGEST_PASSWORD: ${REDIS_INGEST_PASSWORD:?REDIS_INGEST_PASSWORD must be set in .env}
      REDIS_HEALTH_PASSWORD: ${REDIS_HEALTH_PASSWORD:?REDIS_HEALTH_PASSWORD must be set in .env}
      SUCKERPOT_ALLOW_DEFAULT_SECRETS: ${SUCKERPOT_ALLOW_DEFAULT_SECRETS:-0}
    volumes:
      - redis-data:/data
    tmpfs:
      # Generated ACL file (mode 0600, hashed passwords).
      - /run/redis:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=999,gid=999
    networks:
      [sensors-ssh, sensors-rdp, sensors-telnet, sensors-web, sensors-redis, sensors-docker, sensors-mysql, sensors-mssql, sensors-adb, sensors-smb, sensors-sip, tools, backend]
    mem_limit: 384m
    memswap_limit: 384m
    oom_score_adj: -500
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_HEALTH_PASSWORD" redis-cli --user health ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: timescale/timescaledb:2.22.1-pg17
    <<: *hardening
    # Run directly as the image's "postgres" user (uid 70) instead of starting as
    # root and dropping privileges. The data volume is initialised from the image
    # and owned by that user, so no CHOWN/SETUID/SETGID/DAC_OVERRIDE/FOWNER capability is needed.
    user: "70:70"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suckerpot}
      POSTGRES_USER: ${POSTGRES_USER:-suckerpot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    # Tuned for a 4 GB VM shared with the other services.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
      - -c
      - timescaledb.max_background_workers=4
      - -c
      - timescaledb.telemetry_level=off
      - -c
      - log_min_duration_statement=1000
    volumes:
      - db-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=70,gid=70
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=1m,uid=70,gid=70
    networks: [backend]
    shm_size: 256m
    mem_limit: 1g
    memswap_limit: 1g
    oom_score_adj: -500
    cpus: 1.0
    pids_limit: 200
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -q -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: db/Dockerfile
    <<: *hardening
    user: "10001:10001"
    environment:
      <<: *db-env
      # Owner account (schema changes) plus the passwords of the restricted roles it creates.
      POSTGRES_USER: ${POSTGRES_USER:-suckerpot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INGEST_USER: ${POSTGRES_INGEST_USER:-suckerpot_ingest}
      POSTGRES_INGEST_PASSWORD: ${POSTGRES_INGEST_PASSWORD:?POSTGRES_INGEST_PASSWORD must be set in .env}
      POSTGRES_API_USER: ${POSTGRES_API_USER:-suckerpot_api}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD must be set in .env}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      INDICATORS_MAX_ROWS: ${INDICATORS_MAX_ROWS:-500000}
      DB_MAX_SIZE_GB: ${DB_MAX_SIZE_GB:-10}
      SUCKERPOT_ALLOW_DEFAULT_SECRETS: ${SUCKERPOT_ALLOW_DEFAULT_SECRETS:-0}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    networks: [backend]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    <<: *hardening
    user: "10001:10001"
    environment:
      <<: *db-env
      POSTGRES_USER: ${POSTGRES_INGEST_USER:-suckerpot_ingest}
      POSTGRES_PASSWORD: ${POSTGRES_INGEST_PASSWORD:?POSTGRES_INGEST_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USER: ingest
      REDIS_PASSWORD: ${REDIS_INGEST_PASSWORD:?REDIS_INGEST_PASSWORD must be set in .env}
      INGEST_STREAMS: ${INGEST_STREAMS:-events:ssh,events:telnet,events:web,events:rdp,events:redis,events:docker,events:mysql,events:mssql,events:adb,events:smb,events:sip}
      DB_MAX_SIZE_GB: ${DB_MAX_SIZE_GB:-10}
      GEOIP_PROVIDER: ${GEOIP_PROVIDER:-auto}
      GEOIP_REFRESH_DAYS: ${GEOIP_REFRESH_DAYS:-30}
      GEOIP_FAKE_FOR_PRIVATE: ${GEOIP_FAKE_FOR_PRIVATE:-false}
      MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      GREYNOISE_API_KEY: ${GREYNOISE_API_KEY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      GITHUB_ADVISORY_TOKEN: ${GITHUB_ADVISORY_TOKEN:-}
      CVE_WATCH_ENABLED: ${CVE_WATCH_ENABLED:-true}
      CVE_NVD_DAILY_QUOTA: ${CVE_NVD_DAILY_QUOTA:-200}
      CVE_GITHUB_DAILY_QUOTA: ${CVE_GITHUB_DAILY_QUOTA:-100}
      # Decrypts the keys saved from the Settings page (empty = only the .env keys are used).
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      ABUSEIPDB_DAILY_QUOTA: ${ABUSEIPDB_DAILY_QUOTA:-1000}
      GREYNOISE_DAILY_QUOTA: ${GREYNOISE_DAILY_QUOTA:-50}
      REPUTATION_MIN_EVENTS: ${REPUTATION_MIN_EVENTS:-10}
      REPUTATION_INTERVAL_S: ${REPUTATION_INTERVAL_S:-30}
      # Indicators and threat intelligence (M13): passive lookups, fixed API hosts only.
      ABUSECH_AUTH_KEY: ${ABUSECH_AUTH_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSECH_DAILY_QUOTA: ${ABUSECH_DAILY_QUOTA:-1000}
      VIRUSTOTAL_DAILY_QUOTA: ${VIRUSTOTAL_DAILY_QUOTA:-400}
      INTEL_INTERVAL_S: ${INTEL_INTERVAL_S:-30}
      INDICATORS_ENABLED: ${INDICATORS_ENABLED:-true}
      INDICATORS_IGNORE: ${INDICATORS_IGNORE:-}
      INDICATORS_KEEP_DOCUMENTATION: ${INDICATORS_KEEP_DOCUMENTATION:-false}
      # This deployment's own names: never recorded as attack infrastructure.
      API_ALLOWED_HOSTS: ${API_ALLOWED_HOSTS:-}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-}
      INDICATORS_LINK_CAP: ${INDICATORS_LINK_CAP:-500}
    volumes:
      # GeoIP databases downloaded by ingest (the only writable path besides /tmp).
      - geoip-data:/data/geoip
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    # "backend" is internal; "egress" gives ingest (and only ingest) outbound
    # internet access for the enrichment APIs added in M4.
    networks: [backend, egress]
    mem_limit: 384m
    memswap_limit: 384m
    oom_score_adj: -200
    cpus: 1.0
    pids_limit: 100
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "ingest.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    <<: *hardening
    user: "10001:10001"
    environment:
      <<: *db-env
      POSTGRES_USER: ${POSTGRES_API_USER:-suckerpot_api}
      POSTGRES_PASSWORD: ${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD must be set in .env}
      API_ENABLE_DOCS: ${API_ENABLE_DOCS:-false}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-}
      # Dashboard authentication. The API refuses to start without a valid
      # password hash and a strong session secret (unless the demo switches are used).
      # Where the live globe's arcs land. Country level only; empty = API defaults.
      SITE_HOME_LAT: ${SITE_HOME_LAT:-}
      SITE_HOME_LON: ${SITE_HOME_LON:-}
      SITE_HOME_LABEL: ${SITE_HOME_LABEL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH must be set in .env (docker compose run --rm api python -m api.hashpw)}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env (openssl rand -base64 48)}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # Encrypts the enrichment keys entered in Settings (empty = editing them there is disabled).
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOGIN_RATE: ${LOGIN_RATE:-5}
      LOGIN_RATE_GLOBAL: ${LOGIN_RATE_GLOBAL:-30}
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-}
      API_ALLOWED_HOSTS: ${API_ALLOWED_HOSTS:-}
      SUCKERPOT_ALLOW_DEFAULT_SECRETS: ${SUCKERPOT_ALLOW_DEFAULT_SECRETS:-0}
    # Docker's embedded DNS still answers for service names (it listens on
    # 127.0.0.11); external names fail, so the API cannot resolve the internet.
    dns: ["127.0.0.1"]
    ports:
      # The only published port. Never use a sensor port or the admin SSH port.
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8443}:8000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    networks: [backend, dashboard]
    mem_limit: 512m
    memswap_limit: 512m
    oom_score_adj: 300
    cpus: 1.0
    pids_limit: 100
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "api.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # SSH sensor: pure emulation, never executes attacker input.
  sensor-ssh:
    build:
      context: .
      dockerfile: sensors/ssh/Dockerfile
    <<: *hardening
    user: "10001:10001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USER: sensor-ssh
      REDIS_PASSWORD: ${REDIS_SENSOR_SSH_PASSWORD:?REDIS_SENSOR_SSH_PASSWORD must be set in .env}
      EVENTS_STREAM: events:ssh
      EVENTS_MAXLEN: ${EVENTS_MAXLEN:-10000}
      EVENTS_MAX_BYTES_PER_SEC: ${EVENTS_MAX_BYTES_PER_SEC:-200000}
      EVENTS_MAX_BYTES_BURST: ${EVENTS_MAX_BYTES_BURST:-2000000}
      SSH_PORT: "2222"
      # Keep equal to mem_limit below: the sensor sheds load as it nears this figure.
      SSH_MEMORY_LIMIT_MB: "256"
      SSH_PUBLIC_PORT: ${SSH_HOST_PORT:-22}
      SSH_BANNER: ${SSH_BANNER:-SSH-2.0-OpenSSH_9.6p1 Ubuntu-3ubuntu13.14}
      SSH_HOSTNAME: ${SSH_HOSTNAME:-srv-web01}
      SSH_HOSTKEY_DIR: /data/host_keys
      SSH_ACCEPT_CREDENTIALS: ${SSH_ACCEPT_CREDENTIALS:-root:root,root:123456,root:password,admin:admin,ubuntu:ubuntu,pi:raspberry,user:user}
      SSH_ACCEPT_RANDOM_PROB: ${SSH_ACCEPT_RANDOM_PROB:-0.0}
      SSH_MAX_AUTH_ATTEMPTS: ${SSH_MAX_AUTH_ATTEMPTS:-6}
      SSH_MAX_CONNECTIONS: ${SSH_MAX_CONNECTIONS:-200}
      SSH_MAX_PER_IP: ${SSH_MAX_PER_IP:-5}
    # Compose maps the low host port to the high container port: no capability needed.
    # Explicit IPv4 so Docker does not also publish on [::].
    ports:
      - "0.0.0.0:${SSH_HOST_PORT:-22}:2222"
    # Docker's embedded DNS still resolves service names; external names fail.
    dns: ["127.0.0.1"]
    # ingress: inbound only. sensors-ssh: internal link to Redis.
    networks: [ingress, sensors-ssh]
    volumes:
      # Host keys, generated on first start. Never committed.
      - ssh-hostkeys:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    mem_limit: 256m
    memswap_limit: 256m  # no swap: overload fails fast instead of stalling the host
    oom_score_adj: 800
    cpu_shares: 256
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "ssh_sensor.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # RDP sensor: answers the connection handshake only, never authenticates anyone.
  sensor-rdp:
    build:
      context: .
      dockerfile: sensors/rdp/Dockerfile
    <<: *hardening
    user: "10001:10001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USER: sensor-rdp
      REDIS_PASSWORD: ${REDIS_SENSOR_RDP_PASSWORD:?REDIS_SENSOR_RDP_PASSWORD must be set in .env}
      EVENTS_STREAM: events:rdp
      EVENTS_MAXLEN: ${EVENTS_MAXLEN:-10000}
      EVENTS_MAX_BYTES_PER_SEC: ${EVENTS_MAX_BYTES_PER_SEC:-200000}
      EVENTS_MAX_BYTES_BURST: ${EVENTS_MAX_BYTES_BURST:-2000000}
      RDP_PORT: "3389"
      RDP_PUBLIC_PORT: ${RDP_HOST_PORT:-3389}
      RDP_HOSTNAME: ${RDP_HOSTNAME:-}
      RDP_DATA_DIR: /data
      RDP_MAX_CONNECTIONS: ${RDP_MAX_CONNECTIONS:-200}
      RDP_MAX_PER_IP: ${RDP_MAX_PER_IP:-8}
      SENSOR_RDP_NLA_MODE: ${RDP_NLA_MODE:-required}
      SENSOR_RDP_ACCOUNTS: ${RDP_ACCOUNTS:-administrator:P@ssw0rd,administrator:123456,admin:admin}
      RDP_MAX_TLS_PER_IP: ${RDP_MAX_TLS_PER_IP:-4}
    # Explicit IPv4 so Docker does not also publish on [::]. No capability needed.
    ports:
      - "0.0.0.0:${RDP_HOST_PORT:-3389}:3389"
    # Docker's embedded DNS still resolves service names; external names fail.
    dns: ["127.0.0.1"]
    # ingress: inbound only. sensors-rdp: internal link to Redis.
    networks: [ingress, sensors-rdp]
    volumes:
      # Profile secret and RDP certificate, generated on first start. Never committed.
      - rdp-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    mem_limit: 128m
    memswap_limit: 128m  # no swap: overload fails fast instead of stalling the host
    oom_score_adj: 800
    cpu_shares: 256
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "rdp_sensor.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Telnet sensor: emulates a cheap BusyBox device, never executes attacker input.
  sensor-telnet:
    build:
      context: .
      dockerfile: sensors/telnet/Dockerfile
    <<: *hardening
    user: "10001:10001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USER: sensor-telnet
      REDIS_PASSWORD: ${REDIS_SENSOR_TELNET_PASSWORD:?REDIS_SENSOR_TELNET_PASSWORD must be set in .env}
      EVENTS_STREAM: events:telnet
      EVENTS_MAXLEN: ${EVENTS_MAXLEN:-10000}
      EVENTS_MAX_BYTES_PER_SEC: ${EVENTS_MAX_BYTES_PER_SEC:-200000}
      EVENTS_MAX_BYTES_BURST: ${EVENTS_MAX_BYTES_BURST:-2000000}
      TELNET_PUBLIC_PORT: ${TELNET_HOST_PORT:-23}
    # Explicit IPv4 so Docker does not also publish on [::]. No capability needed.
    ports:
      - "0.0.0.0:${TELNET_HOST_PORT:-23}:2323"
    # Docker's embedded DNS still resolves service names; external names fail.
    dns: ["127.0.0.1"]
    # ingress: inbound only. sensors-telnet: internal link to Redis.
    networks: [ingress, sensors-telnet]
    volumes:
      # Device identity (profile secret), generated on first start. Never committed.
      - telnet-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    mem_limit: 256m
    memswap_limit: 256m  # no swap: overload fails fast instead of stalling the host
    oom_score_adj: 800
    cpu_shares: 256
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "telnet_sensor.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Web sensor: a fake Apache + PHP 8.3 stack, pure emulation, never executes attacker input.
  sensor-web:
    build:
      context: .
      dockerfile: sensors/web/Dockerfile
    <<: *hardening
    user: "10001:10001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USER: sensor-web
      REDIS_PASSWORD: ${REDIS_SENSOR_WEB_PASSWORD:?REDIS_SENSOR_WEB_PASSWORD must be set in .env}
      EVENTS_STREAM: events:web
      EVENTS_MAXLEN: ${EVENTS_MAXLEN:-10000}
      EVENTS_MAX_BYTES_PER_SEC: ${EVENTS_MAX_BYTES_PER_SEC:-200000}
      EVENTS_MAX_BYTES_BURST: ${EVENTS_MAX_BYTES_BURST:-2000000}
      WEB_HTTP_PORT: "8080"
      WEB_HTTPS_PORT: "8443"
      WEB_HTTP_PUBLIC_PORT: ${HTTP_HOST_PORT:-80}
      WEB_HTTPS_PUBLIC_PORT: ${HTTPS_HOST_PORT:-443}
      WEB_HOSTNAME: ${WEB_HOSTNAME:-srv-web01}
      WEB_DATA_DIR: /data
      WEB_PHP_VERSION: ${WEB_PHP_VERSION:-8.3.6}
      WEB_WP_VERSION: ${WEB_WP_VERSION:-6.8.1}
      WEB_MAX_CONNECTIONS: ${WEB_MAX_CONNECTIONS:-200}
      WEB_MAX_PER_IP: ${WEB_MAX_PER_IP:-10}
      # Keep equal to mem_limit below: the sensor sheds load as it nears this figure.
      WEB_MEMORY_LIMIT_MB: "256"
    # Explicit IPv4 so Docker does not also publish on [::]. No capability needed.
    ports:
      - "0.0.0.0:${HTTP_HOST_PORT:-80}:8080"
      - "0.0.0.0:${HTTPS_HOST_PORT:-443}:8443"
    # Docker's embedded DNS still resolves service names; external names fail.
    dns: ["127.0.0.1"]
    # ingress: inbound only. sensors-web: internal link to Redis.
    networks: [ingress, sensors-web]
    volumes:
      # Profile secret and TLS certificate, generated on first start. Never committed.
      - web-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    mem_limit: 256m
    memswap_limit: 256m  # no swap: overload fails fast instead of stalling the host
    oom_score_adj: 800
    cpu_shares: 256
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "web_sensor.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Redis sensor: a fake unauthenticated Redis server, pure emulation, never executes attacker input.
  sensor-redis:
    build:
      context: .
      dockerfile: sensors/redis/Dockerfile
    <<: *hardening
    user: "10001:10001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USER: sensor-redis
      REDIS_PASSWORD: ${REDIS_SENSOR_REDIS_PASSWORD:?REDIS_SENSOR_REDIS_PASSWORD must be set in .env}
      EVENTS_STREAM: events:redis
      # Short stream cap: seven more sensors share Redis memory. Ingest drains it continuously.
      EVENTS_MAXLEN: ${EVENTS_MAXLEN_LOW:-3000}
      EVENTS_MAX_BYTES_PER_SEC: ${EVENTS_MAX_BYTES_PER_SEC:-200000}
      EVENTS_MAX_BYTES_BURST: ${EVENTS_MAX_BYTES_BURST:-2000000}
      SENSOR_PORT: "6379"
      REDIS_PUBLIC_PORT: ${REDIS_HOST_PORT:-6379}
      SENSOR_DATA_DIR: /data
      SENSOR_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-200}
      SENSOR_MAX_PER_IP: ${REDIS_MAX_PER_IP:-8}
      # Keep equal to mem_limit below: the sensor sheds load as it nears this figure.
      SENSOR_MEMORY_LIMIT: "201326592"
    # Explicit IPv4 so Docker does not also publish on [::]. No capability needed.
    ports:
      - "0.0.0.0:${REDIS_HOST_PORT:-6379}:6379"
    # Docker's embedded DNS still resolves service names; external names fail.
    dns: ["127.0.0.1"]
    # ingress: inbound only. sensors-redis: internal link to Redis.
    networks: [ingress, sensors-redis]
    volumes:
      # Profile secret, generated on first start. Never committed.
      - redis-sensor-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
    mem_limit: 192m
    memswap_limit: 192m  # no swap: overload fails fast instead of stalling the host
    oom_score_adj: 800
    cpu_shares: 256
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "redis_sensor.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

