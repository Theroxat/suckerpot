# SuckerPot static site. Runs as the unprivileged nginx user, on port 8080.
# Included as /etc/nginx/conf.d/default.conf of nginxinc/nginx-unprivileged.

server_tokens off;
access_log off;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/css application/javascript image/svg+xml text/plain application/json;

map $uri $site_cache {
    default                       "no-cache";
    ~^/fonts/                     "public, max-age=31536000, immutable";
    ~\.(css|js|svg|webp|png)$     "public, max-age=86400";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # The page is fully static: no third-party requests, no inline script or style.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $site_cache always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Only GET and HEAD make sense on a static site.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
}
