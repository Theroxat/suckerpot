[project]
name = "suckerpot-netproto"
version = "0.1.0"
description = "Selfhostr network protocol spn/1: wire models, signatures, blinding, proof of work and buckets (pure functions, no I/O)"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["suckerpot_netproto"]
# Package data (network defaults, pseudonym words) ships inside the wheel, whatever .gitignore says.
artifacts = ["suckerpot_netproto/data/*"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]

[tool.mypy]
strict = true
python_version = "3.13"
exclude = ["^\\.venv/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
