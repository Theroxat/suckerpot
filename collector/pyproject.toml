[project]
name = "suckerpot-collector"
version = "0.1.0"
description = "SuckerPot collector and analyzer: quarantined payload downloads and static analysis"
requires-python = ">=3.13"
dependencies = [
    "suckerpot-db",
    "suckerpot-egress",
    "suckerpot-analysis",
]

[project.optional-dependencies]
# Fuzzy hash. No cp313 wheel exists: the Dockerfile builds it in its builder stage.
tlsh = ["suckerpot-analysis[tlsh]"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
suckerpot-db = { path = "../db" }
suckerpot-egress = { path = "../egress" }
suckerpot-analysis = { path = "../analysis" }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S104", "S603", "E501"]

[tool.mypy]
strict = true
python_version = "3.13"
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a real TimescaleDB (skipped unless POSTGRES_HOST is set)"]
