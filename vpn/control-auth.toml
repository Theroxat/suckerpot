# gluetun control server: read-only role for the egress self-check.
# No role can change the tunnel (no PUT /v1/vpn/status); every other route is denied by
# HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE.
[[roles]]
name = "egress-readers"
routes = ["GET /v1/vpn/status", "GET /v1/publicip/ip"]
auth = "none"
